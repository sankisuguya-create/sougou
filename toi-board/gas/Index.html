<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>といボード</title>
<style>
:root{--z:0.8;
  --ink:#1A1A1A; --sub:#55585E; --line:#D5D8DD; --paper:#F7F7F4; --white:#fff;
  --cat-1:#0F5EA8; --cat-2:#C86A00; --cat-3:#6E4310;
  --kb:#BCD9F5; --fill-a:#D7E8F8; --fill-b:#FBE3B4; --gift:#E6F2DD; --done:#BFE3AE; --gold:#E0A43A;
  --grid:24px;
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","IPAexGothic","IPAGothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--white);font-weight:700}
.btn.on{border-color:var(--cat-1);background:var(--fill-a)}
.btn.primary{background:var(--cat-1);border-color:var(--cat-1);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{border-color:#C0330A;color:#C0330A;background:#fff}
.demo{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub)}
.demo select{font-size:14px;padding:4px}

/* 上の帯 */
.head{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0 8px 0 0}
.faces{display:flex;gap:6px}
.face{min-height:52px;min-width:96px;padding:0 12px;border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;background:#fff;font-weight:700;font-size:17px}
.face.on{border-color:var(--ink)}
.face.drop{background:var(--fill-a);border-color:var(--cat-1)}
.face .n{font-size:13px;color:var(--sub);margin-left:4px}
.modes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:6px;padding:0 12px 8px;align-items:center;flex-wrap:wrap}
.tools .hint{font-size:14px;color:var(--sub);margin-left:6px}
.viewing{background:#FFF4D6;border:2px solid var(--cat-2);border-radius:12px;padding:6px 12px;margin:0 12px 8px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ボード */
.main{display:flex;gap:12px;padding-left:12px}
.main .wrap{flex:1;margin-left:0;min-width:0}
.tbar{display:flex;flex-direction:column;gap:8px;flex:0 0 64px}
.tbtn{width:64px;min-height:64px;border:2px solid var(--line);border-radius:14px;background:#fff;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tbtn .i{font-size:24px;line-height:1}
.tbtn.on{border-color:var(--cat-1);background:var(--fill-a)}
.tbtn:disabled{opacity:.45}
.tbtn.org{margin-top:10px;border-color:var(--cat-2)}
.tbtn.org.on{background:#FFF4D6;border-color:var(--cat-2)}
.tbtn.org:disabled{opacity:1;background:#F1F1EE}
.tbtn small{font-size:12px;font-weight:700;color:var(--sub)}
.fab{position:fixed;left:16px;bottom:16px;width:72px;height:72px;border-radius:50%;border:0;background:var(--cat-1);color:#fff;font-size:44px;line-height:1;font-weight:400;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:40;display:grid;place-items:center;padding:0 0 4px}
.banner{margin:0 12px 6px 12px;padding:6px 12px;border-radius:10px;background:var(--fill-a);font-weight:700}
.wrap{position:relative;margin:0 12px 12px;height:calc((100vh / var(--z)) - 150px);min-height:420px;overflow-x:hidden;overflow-y:auto;border:2px solid var(--line);border-radius:12px;background:#fff;touch-action:pan-x pan-y}
.board{position:relative;width:100%;height:6240px;
  background-image:
    linear-gradient(to right, rgba(15,94,168,.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(15,94,168,.10) 1px, transparent 1px);
  background-size:var(--grid) var(--grid);}
.board.back{background-color:#E4E4E1}
.board.gift{background-color:#E8D6BE}
.board.trash{background-color:#DDEBF7}
.face[data-face=back]{background:#F0F0EE}
.face[data-face=gift]{background:#F4EADC}
.face[data-face=trash]{background:#EAF2FA}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.arrows line{stroke:var(--ink);stroke-width:4;pointer-events:stroke;cursor:pointer}
svg.arrows line.hit{stroke:transparent;stroke-width:28}

.item{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none}
.note.has-seal{padding-bottom:76px}
.note.has-seal.one{padding-bottom:44px}
.note{z-index:1;width:168px;min-height:120px;padding:14px 12px 22px;background:var(--fill-b);box-shadow:0 2px 4px rgba(0,0,0,.15);font-size:18px;font-weight:700;line-height:1.45;word-break:break-all;border-radius:2px}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:70px;height:16px;margin-left:-35px;background:rgba(255,255,255,.65);box-shadow:0 0 1px rgba(0,0,0,.2)}
.note.gift::before{content:"頂き物";background:#9C6B3C;color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center;letter-spacing:.1em}
.note.done{background:var(--done)}
.donemark{position:absolute;left:6px;bottom:4px;font-size:12px;font-weight:700;color:#2E5E1F;background:rgba(255,255,255,.7);border-radius:99px;padding:0 6px}
.by{display:block;margin-top:4px;font-size:13px;color:#2E5E1F}
.note.done .layer{background:var(--done)}
.note.dragging{box-shadow:0 10px 20px rgba(0,0,0,.25);z-index:50;transform:rotate(-2deg)}
.note.target{outline:4px solid var(--cat-1);outline-offset:4px}
.note.sel{outline:4px dashed var(--cat-2);outline-offset:4px}
/* 重なり：下の付箋を 右下へ 少しずつ ずらし、紙の 厚みに 見せる */
.layer{position:absolute;inset:0;background:var(--fill-b);border-right:1px solid rgba(0,0,0,.22);border-bottom:1px solid rgba(0,0,0,.22);border-radius:2px;z-index:-1;box-shadow:1px 1px 0 rgba(0,0,0,.06)}
.from{display:block;margin-top:4px;font-size:12px;color:var(--cat-3)}
/* コメントの しるし（付箋の 右上） */
.cicon::after{content:"";position:absolute;inset:-8px}
.cicon{position:absolute;right:-12px;top:-12px;min-width:38px;height:34px;padding:0 6px;border-radius:99px;background:#fff;border:2px solid var(--cat-1);color:var(--cat-1);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;z-index:3}
.cbtn{position:absolute;right:6px;bottom:6px;width:44px;height:44px;border-radius:50%;border:2px solid var(--cat-1);background:#fff;font-size:20px;display:grid;place-items:center;z-index:4}
.cbtn.on{background:var(--fill-a)}
.clist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.clist .c{background:#F4F7FB;border-radius:10px;padding:8px 12px;font-size:17px}
.clist .c small{display:block;color:var(--sub);font-size:12px}
.pick{position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;display:grid;place-items:center}
.stars{position:absolute;left:6px;right:6px;bottom:2px;height:66px;pointer-events:none}
.stars.one{height:34px}
.stars img{width:30px;height:30px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.stars .slot{position:absolute;transform:translateX(-50%)}
.stars .rot{display:block;transform:rotate(var(--r,0deg))}
.stars .slot,.hit .sc{display:flex;align-items:center}
.hit .sc{position:relative}
/* 数は シールの 右下に 重ねて 出す（横に 並べても 幅が 増えない） */
.cnt{position:absolute;right:1px;bottom:1px;font-size:14px;font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:3px #1A1A1A;paint-order:stroke fill;text-shadow:0 0 1px #1A1A1A;white-space:nowrap;pointer-events:none;transform:none}
.show.old{background:#8A8F98}
/* 班の中の いいね：ふつうの シールの 半分の 大きさで、付箋の 文の 上に */
/* 班の中の いいね：付箋の 右の 辺 ぎりぎりに 縦に ならべ、高さの 中央に そろえる。文字と 重なったら シールが 上 */
.likes{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;pointer-events:none}
.lk{display:inline-block;width:15px;height:15px}
.lk img{width:15px;height:15px;display:block}
.mates{display:inline-flex;gap:10px;align-items:center;font-size:13px;color:var(--sub);margin-left:12px}
.mates span{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--ink)}
.show{position:absolute;left:8px;top:-14px;background:#0F5EA8;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
/* シール貼り（ほかの班）画面 */
.gal{padding:12px 16px 80px}
.gal-head{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;background:var(--paper)}
.gal-head h1{font-size:22px;margin:0}
.kpick{width:64px;height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;display:grid;place-items:center}
.kpick.on{border-color:var(--cat-1);background:var(--fill-a)}
.kpick img{width:46px;height:46px;pointer-events:none}
.gteam{margin:18px 0 8px;font-size:18px}
.gnotes{display:flex;flex-wrap:wrap;gap:28px}
.big{position:relative;width:240px;min-height:200px;padding:24px 16px 76px;background:var(--fill-b);box-shadow:0 2px 5px rgba(0,0,0,.18);font-size:21px;font-weight:700;line-height:1.5;word-break:break-all;border-radius:2px;cursor:pointer}
.big::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:18px;margin-left:-42px;background:rgba(255,255,255,.65);box-shadow:0 0 1px rgba(0,0,0,.2)}
.seal{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px}
.seal img{width:100%;height:100%;display:block;pointer-events:none}
.seal.sel{filter:drop-shadow(0 0 3px #0F5EA8)}
.peel{position:absolute;right:-30px;top:-30px;min-height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:99px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap;z-index:5}
@keyframes stick{0%{transform:scale(1.5) rotate(var(--r))}60%{transform:scale(.9) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r))}}
.seal.new{animation:stick .28s ease-out}
/* ？のたね：画面の 上から カードが ひょっこり 出る */
.seedbtn{min-height:48px;padding:0 16px;border:2px solid var(--cat-2);border-radius:99px;background:#FFF4D6;font-weight:700;font-size:17px}
.seedbtn.on{background:var(--cat-2);color:#fff}
.seeds{position:fixed;left:50%;top:0;transform:translateX(-50%);width:min(760px,100%);z-index:120;background:#FFF9EA;border:2px solid var(--cat-2);border-top:0;border-radius:0 0 18px 18px;padding:12px 14px 14px;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:peek .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes peek{0%{transform:translate(-50%,-110%)}100%{transform:translate(-50%,0)}}
.seeds .cards{display:flex;flex-wrap:wrap;gap:10px}
.seedcard{position:relative;min-width:84px;min-height:60px;padding:6px 14px;border:2px solid #D9B56A;border-radius:12px;background:#fff;font-size:20px;font-weight:700;box-shadow:0 3px 0 #E8CF95}
.seedcard:active{transform:translateY(2px);box-shadow:0 1px 0 #E8CF95}
.seedcard.mine{border-style:dashed}
.seedcard .x::after{content:"";position:absolute;inset:-8px}
.seedcard .x{position:absolute;right:-10px;top:-10px;width:30px;height:30px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:24px;padding:0}
.seeds .add{display:flex;gap:8px;margin-top:10px}
.seeds .add input{flex:1;font:inherit;font-size:18px;padding:6px 10px;border:2px solid var(--line);border-radius:10px}
.gteam .left{display:inline-flex;gap:10px;align-items:center;margin-left:14px;font-size:14px;font-weight:700;color:var(--sub)}
.gteam .lk{display:inline-flex;align-items:center;gap:2px}
.gteam .lk.none{opacity:.3}
.frame{border:3px dashed var(--cat-3);border-radius:10px;background:rgba(251,227,180,.12)}
.frame .label{position:absolute;left:8px;top:-15px;background:#fff;padding:2px 8px;font-weight:700;font-size:16px;color:var(--cat-3);min-width:40px;min-height:28px;border:2px solid var(--cat-3);border-radius:8px;white-space:nowrap;touch-action:none;cursor:grab;z-index:2}
.frame .label.onedge{transform:translate(-50%,-50%)}
.frame .label.dragging{cursor:grabbing;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.tsug{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tsug .btn{min-height:48px;border-color:var(--cat-3);color:var(--cat-3)}
.frame .grip{position:absolute;right:-14px;bottom:-14px;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--cat-3)}
.empty{position:absolute;left:40px;top:40px;color:var(--sub);font-size:18px}

/* 下から出る操作 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(720px,100%);border-radius:16px 16px 0 0;padding:16px;max-height:calc(85vh / var(--z));overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
/* 付箋を 大きく 出して その上で 書く・直す */
.sheet.bigsheet{position:relative;z-index:0;width:min(940px,calc(96vw / var(--z)));border-radius:16px 16px 0 0;max-height:calc(80vh / var(--z))}
.sheet-bg.bigsheet{flex-direction:column;align-items:center;justify-content:flex-end}
.sheet-bg.bigsheet .seeds{position:static;transform:none;animation:none;width:min(940px,calc(96vw / var(--z)));box-sizing:border-box;border:2px solid var(--cat-2);border-radius:18px;margin:0 0 10px;flex:none}
.bigwrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.bignote{position:relative;flex:none;width:min(400px,100%);min-height:280px;padding:26px 20px 20px;background:var(--fill-b);box-shadow:0 4px 12px rgba(0,0,0,.22);border-radius:3px;margin-top:10px}
.bignote::before{content:"";position:absolute;top:-10px;left:50%;width:110px;height:22px;margin-left:-55px;background:rgba(255,255,255,.7);box-shadow:0 0 1px rgba(0,0,0,.2)}
.bignote.done{background:var(--done)}.bignote.gift::before{content:"頂き物";background:#9C6B3C;color:#fff;font-size:13px;font-weight:700;line-height:22px;text-align:center}
.bignote textarea,.bignote .txt{display:block;width:100%;min-height:220px;border:0;background:transparent;font:inherit;font-size:28px;font-weight:700;line-height:1.5;padding:0;resize:none;outline:none;word-break:break-all}
.bignote .count{position:absolute;right:10px;bottom:6px;font-size:13px;color:var(--sub)}
.rothead{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 0;background:var(--paper);font-size:22px}
.rothead .step{font-size:15px;font-weight:700;color:var(--sub);border:2px solid var(--line);border-radius:99px;padding:2px 10px}
.rothead .rotleft{font-weight:700;font-variant-numeric:tabular-nums;color:var(--cat-1)}
.galbody{display:flex;gap:20px;align-items:flex-start}
.galbody .gnotes{flex:1;min-width:0}
.book{position:sticky;top:64px;flex:none;width:250px;display:flex;flex-direction:column;gap:10px;background:#FBF6EA;border:2px solid #D9C9A3;border-radius:14px;padding:12px;box-shadow:inset 6px 0 0 #E8DBBB}
.book .page{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;border-radius:12px;background:transparent;padding:6px 4px}
.book .page.on{border-color:var(--cat-1);background:#fff}
.book .slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.book .slot{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 2px #E6DCC4}
.book .slot.used{background:repeating-linear-gradient(45deg,#F1EADA 0 6px,#FBF6EA 6px 12px);box-shadow:inset 0 0 0 2px dashed #D9C9A3}
.book .slot img{pointer-events:none}
.book .cap{font-size:14px;font-weight:700}.book .cap2{font-size:12px;color:var(--sub)}
.stnote .cm{position:relative;display:inline-block;margin-top:8px;font-weight:700;color:var(--cat-1);cursor:default;outline:none}
.stnote .cm .tip{display:none;position:absolute;left:0;top:100%;z-index:30;width:240px;background:#fff;border:2px solid var(--cat-1);border-radius:10px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.2);color:var(--ink);font-weight:400}
.stnote .cm:hover .tip,.stnote .cm:focus .tip{display:block}
.stnote .cm .tip p{margin:4px 0}
.gal.wait .order{font-size:22px;line-height:1.9}.gal.wait .order li.me{font-weight:700;color:var(--cat-1)}
.rotpanel{border:2px solid var(--line);border-radius:14px;padding:6px 12px;margin:8px 0;background:#fff}
.rotnow{margin-top:6px}.rotnow .rothead{position:static;font-size:20px}
.btn.big{min-height:64px;font-size:18px}
.stage{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding:12px 4px}
.stnote{width:260px;background:var(--fill-b);box-shadow:0 2px 5px rgba(0,0,0,.18);padding:22px 16px 16px;border-radius:2px;position:relative}
.stnote::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:18px;margin-left:-42px;background:rgba(255,255,255,.65)}
.stnote .t{font-size:21px;font-weight:700;line-height:1.5;word-break:break-all;margin-bottom:10px}
.stnote .seals{display:flex;flex-wrap:wrap;gap:4px}
.stnote .s{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.ngrid{display:grid;grid-template-columns:150px minmax(0,400px) 150px;gap:24px;justify-content:center;align-items:start;padding-top:14px}
.ncol{display:flex;flex-direction:column;gap:10px}.ncol .btn{width:100%;min-height:56px}
.ncol.r{align-items:center}
.ngrid .bignote{width:100%;margin-top:0}
.stackbtn b{margin-left:6px;font-size:18px}
.stackbg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.stackpop{background:#fff;border-radius:16px;padding:14px;width:min(900px,calc(94vw / var(--z)));max-height:calc(86vh / var(--z));overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toplabel{font-size:13px;font-weight:700;color:var(--sub);margin-top:6px}
@media (max-width:760px){.ngrid{grid-template-columns:1fr}.ncol{flex-direction:row;flex-wrap:wrap}.ncol .btn{width:auto}}
.likebtn{flex:none;width:64px;height:64px;border:2px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;opacity:.55;filter:grayscale(1)}
.likebtn.on{opacity:1;filter:none;border-color:var(--ink)}
.grp{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}.glabel{font-size:13px;font-weight:700;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{min-height:56px}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--ink);border-radius:10px;min-height:96px}
.stacklist{display:flex;gap:10px;flex-wrap:wrap}
.stacklist .note{position:relative}
.stacklist .one{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:200}

/* 先生 */
.teacher{padding:12px;max-width:1100px}
.teacher h2{font-size:18px;margin:18px 0 8px}
.mode{display:flex;align-items:center;gap:10px;margin:6px 0}
.mode .btn{min-width:220px;text-align:left}
table{border-collapse:collapse;font-size:14px;background:#fff}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:left}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stars.pop svg{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script>

  {k:'trash', label:'ゴミばこ'}
];
/* 班は「組-番号」で 学年の中で 一意（例 A-3）。本番は スプレッドシートの「スポット」から 読む */
var SPOTS = (function(){
  var N = {
    A:['阪急西宮北口','甲山','西宮砲台','神戸女学院','有馬川','えびすかき','今津灯台'],
    B:['甲子園球場','西宮神社','御前浜・香櫨園浜','名塩和紙','ヨットハーバー','廣田神社','夙川'],
    C:['甲子園浜','甑岩','今津六角堂','貝類館','高木地区','金仙寺湖','武庫川']
  }, out = [];
  Object.keys(N).forEach(function(c){ N[c].forEach(function(n, i){ out.push({team:c + '-' + (i + 1), cls:c, no:i + 1, name:n}); }); });
  return out;
})();
var SCOPES = [{k:'off', label:'切'}, {k:'class', label:'同じ組'}, {k:'grade', label:'学年'}];
var MODES = [
  {k:'view',    label:'共同閲覧',          desc:'ほかの班の 表がわを 見られる',                 scoped:true},
  {k:'propose', label:'アイデア提案',      desc:'ほかの班の「いただきもの」に 付箋を 貼れる',   scoped:true},
  {k:'starOut', label:'見合い会の 画面',  desc:'入れると、この 組の 児童の 画面が 見合い会の 待ち画面に なる', scoped:true}
];
function blankModes(){ return {view:'off', propose:'off', starIn:false, starOut:'off', round:1, orgMin:5, rotMin:4, rot:null, research:'off', orgMode:'on'}; }
/* 調べモード：組ごと。入れると 付箋の 右下に めくれが 出て、うらに しらべて わかった ことを 書ける */
/* 知っててほしい（基本情報）：アピールしたい 問いの 前提に なる 付箋。青く なり、班の 面ごとに 1つの 山（表には「知っててほしいこと」）に まとまる */
function kbOf(team, face){ return S.items.filter(function(x){ return x.kind === 'note' && x.kb && x.team === team && (!face || x.face === face); }).sort(function(a, b){ return (a.kbAt || 0) - (b.kbAt || 0) || String(a.id).localeCompare(String(b.id)); }); }
function kbAnchor(team, face){ return kbOf(team, face)[0] || null; }
function setKb(n, on){
  var t0 = Date.now();
  commit(function(){
    if(on){
      var an = kbAnchor(n.team, n.face);
      stackOf(n.id).forEach(function(k){ k.stackOf = null; var p = freeSpot(k.team, k.face); k.x = p.x; k.y = p.y; });
      n.kb = true; n.kbAt = t0; n.stackOf = null; n.pick = 0;
      if(an && an.id !== n.id){ n.x = an.x; n.y = an.y; }
      dropArrows(n.id);
    } else {
      delete n.kb; delete n.kbAt;
      var q = freeSpot(n.team, n.face); n.x = q.x; n.y = q.y;
    }
  });
}
var FOLDER_SVG = '<svg class="kbfolder" viewBox="0 0 24 20" aria-hidden="true"><path d="M1.5 3.5Q1.5 2 3 2H8.6L10.8 4.4H21Q22.5 4.4 22.5 5.9V16.5Q22.5 18 21 18H3Q1.5 18 1.5 16.5Z" fill="#8EC3EE" stroke="#2C6FB0" stroke-width="1.6" stroke-linejoin="round"/><path d="M1.5 7.2H22.5" stroke="#2C6FB0" stroke-width="1.4"/></svg>';
function kbButton(team){
  var n = kbOf(team, 'front').length;
  return n ? '<button class="btn kbbtn" data-act="kb" data-t="' + team + '">' + FOLDER_SVG + '知っててほしい<b>' + n + '</b></button>' : '';
}
function researchOn(team){ return ((S.modes || {})[clsOf(team)] || {}).research === 'on'; }

/* ===== 保存（見本：localStorage。GAS版は build で この区間を 差し替える） ===== */
/* 体験版：?trial=1 で 開くと、本番と 別の 保存場所に 見本の データを 入れて 案内を 出す */
document.documentElement.lang = 'ja';  // 埋め込み先に lang が 無くても 日本語の 字形で 描く
/* 体験⑥：左に 児童、右に 先生 を 1つの ページに ならべる（iframe を 使わない ので GAS の 中でも 動く）。
   2つの 画面は それぞれ 自分の me / ui を もち、さわった 側に 切り替えてから ふつうの 処理を 通す */
var SPLIT = null, TRIAL_ST = {n:0, min:false};
function paneRoot(){ return SPLIT ? document.querySelector('[data-pane="' + SPLIT.cur + '"]') || document : document; }
function $q(sel){ return paneRoot().querySelector(sel); }
function $id(id){ return paneRoot().querySelector('#' + id); }
function $qa(sel){ return paneRoot().querySelectorAll(sel); }
function paneSync(){ if(SPLIT){ SPLIT.panes[SPLIT.cur].me = me; SPLIT.panes[SPLIT.cur].ui = ui; } }
function usePane(i){ if(!SPLIT || i === SPLIT.cur) return; paneSync(); SPLIT.cur = i; me = SPLIT.panes[i].me; ui = SPLIT.panes[i].ui; }
['pointerdown', 'click', 'focusin', 'input', 'change'].forEach(function(t){ document.addEventListener(t, function(e){ var p = e.target && e.target.closest && e.target.closest('[data-pane]'); if(p) usePane(+p.getAttribute('data-pane')); }, true); });
/* ならべた 画面でも ふだんと 同じ 幅で 描き、横スクロールで 見る（付箋の 位置が 重ならない） */
/* 見た目は 80%（ブラウザの ズーム 80% と 同じ 見え方）。html に zoom を かけ、
   画面の 幅と ポインタの 移動量は この 倍率で CSS の 大きさに もどして 計算する */
var Z = window.TOI_ZOOM || 0.8;  // 検査では 1 に して 寸法を 確かめる
document.documentElement.style.zoom = Z;
document.documentElement.style.setProperty('--z', Z);
function paneW(){ return window.innerWidth / Z; }
var TRIAL = !!window.TOI_TRIAL || /[?&#]trial/.test(location.search + location.hash);
'PLATFORM_BEGIN';
/* GAS版の 保存。build.cjs が ../index.html の PLATFORM 区間を これに 差し替える。
   約90人が 同時に つかう 前提で 軽くする：
   ・モード・回は ふだんの 確認で 届く（版が 変わった 時だけ）。ページの 開き直しは いらない
     （全員が 一斉に 開き直すと、同時に 動かせる 処理の 上限（約30）を こえるため）。
   ・児童は 約10秒（±3秒）ごとに 自分の班（と 今 見ている 班、シール貼りの 時は その 班たち）の 版だけを 確かめる。
     版は キャッシュで まとめて 引くので、変化が なければ シートは 読まない。
   ・書く：付箋は 250ms、シール・コメントは 1.5秒 ためて まとめて 送る（書きこみの 回数を へらす）。
   ・開く・確かめるに 失敗したら、1〜5秒の ばらばらな 間を おいて やり直す（一斉の やり直しを 防ぐ）。
   ・タブが 裏の 間は 確かめない。 */
var Platform = (function(){
  var POLL = window.TOI_POLL_MS || 10000, JIT = window.TOI_POLL_JIT == null ? 3000 : window.TOI_POLL_JIT;
  var SEAL_WAIT = window.TOI_SEAL_WAIT == null ? 1500 : window.TOI_SEAL_WAIT;
  var role = '', own = '', watching = null, tv = {}, all = 0, got = {}, mver = '';
  var pend = {}, q = blank(), timer = null, due = 0, busy = false, pollT = null, errs = 0, polling = false, again = false;
  function blank(){ return {up:{}, del:{}, star:{}, cmt:{}, purge:{}, cmtDel:{}, modes:null}; }
  function empty(x){ return !Object.keys(x.up).length && !Object.keys(x.del).length && !Object.keys(x.star).length && !Object.keys(x.cmt).length && !Object.keys(x.purge).length && !Object.keys(x.cmtDel).length && !x.modes; }
  function net(t){ var el = document.getElementById('net'); if(el) el.textContent = t; }
  function backoff(){ return 1000 + Math.random() * 4000; }
  /* 送り終わるまでの 変更を 端末にも 置く（通信が 切れたまま 閉じても、次に 開いた 時に 送り直す） */
  var keepKey = '', inflight = null;
  function keep(){
    if(!keepKey) return;
    try{
      var all = JSON.parse(JSON.stringify(q));
      if(inflight) ['up', 'del', 'star', 'cmt', 'purge', 'cmtDel'].forEach(function(t){ Object.keys(inflight[t] || {}).forEach(function(k){ if(!(k in all[t])) all[t][k] = inflight[t][k]; }); });
      if(empty(all)) localStorage.removeItem(keepKey); else localStorage.setItem(keepKey, JSON.stringify(all));
    }catch(e){}
  }
  function run(name, args, ok, ng){
    var r = google.script.run
      .withSuccessHandler(function(x){ errs = 0; net(''); ok(x); })
      .withFailureHandler(function(e){ errs++; net('つながりにくい ようです（' + errs + '）。そのまま つづけて だいじょうぶ'); if(ng) ng(e); });
    r[name].apply(r, args);
  }
  /* 早く 送る ほうを 優先（付箋の 変更が あれば シールの 待ちより 先に 送る） */
  function schedule(ms){
    ms = ms == null ? 250 : ms;
    var at = Date.now() + ms;
    if(timer && due && due <= at) return;
    clearTimeout(timer); due = at; timer = setTimeout(function(){ timer = null; due = 0; send(); }, ms);
  }
  function send(){
    if(busy || empty(q)) return;
    busy = true;
    var sent = q; q = blank(); inflight = sent;
    var ops = {
      up:Object.keys(sent.up).map(function(k){ return sent.up[k]; }),
      del:Object.keys(sent.del),
      star:Object.keys(sent.star).map(function(k){ return sent.star[k]; }),
      cmt:Object.keys(sent.cmt).map(function(k){ return sent.cmt[k]; }),
      purge:Object.keys(sent.purge),
      cmtDel:Object.keys(sent.cmtDel).map(function(k){ return sent.cmtDel[k]; }),
      modes:sent.modes
    };
    run('apply', [ops], function(r){
      busy = false; inflight = null; keep();
      Object.keys(sent.up).concat(Object.keys(sent.del)).forEach(function(id){ if(!q.up[id] && !q.del[id]) delete pend[id]; });
      Object.keys(sent.star).forEach(function(id){ if(!(id in q.star)) delete pend['*' + id]; });
      Object.keys(sent.cmt).forEach(function(id){ if(!(id in q.cmt)) delete pend['#' + id]; });
      if(r && r.rejected && r.rejected.length){
        // モードや 回が 先に 変わっていた：最新の モードと 班の 中身を 取り直す
        toast('うまく 送れなかったので、さいしんの 画面に します');
        mver = ''; if(own) tv[own] = 0; if(watching) tv[watching] = 0; all = 0;
        pull();
      }
      if(!empty(q)) schedule(0);
    }, function(){
      busy = false; inflight = null;
      // 送れなかった 分を 戻す（あとから した 変更を 優先）
      Object.keys(sent.up).forEach(function(k){
        var later = q.up[k], first = sent.up[k];
        if(q.del[k]) return;
        if(!later){ q.up[k] = first; return; }
        // あとの 変更を 前の 変更に 重ねる（どちらも 失わない）
        if(later.p && first.p){ Object.keys(first.p).forEach(function(f){ if(!(f in later.p)) later.p[f] = first.p[f]; }); }
        else if(later.p && !first.p){ Object.keys(later.p).forEach(function(f){ first[f] = later.p[f]; }); (later.u || []).forEach(function(f){ delete first[f]; }); q.up[k] = first; }
      });
      Object.keys(sent.purge).forEach(function(k){ q.purge[k] = 1; });

      S.stars = S.stars.filter(function(s){ return !gone[s.noteId] || (s.viewer === me && pend['*' + skey(s)]); });
      S.comments = (S.comments || []).filter(function(c){ return !gone[c.noteId] || (c.viewer === me && pend['#' + c.noteId]); });
    });
    r.items.forEach(function(x){
      if(pend[x.id]) return;
      S.items = S.items.filter(function(o){ return o.id !== x.id; });
      if(!x.del) S.items.push(x);
    });
    r.stars.forEach(function(s){
      if(s.viewer === me && pend['*' + skey(s)]) return;
      S.stars = S.stars.filter(function(o){ return !(skey(o) === skey(s) && o.viewer === s.viewer); });
      if(s.on) S.stars.push(starOf(s));
    });
    (r.comments || []).forEach(function(c){
      if(c.viewer === me && pend['#' + c.noteId]) return;
      S.comments = (S.comments || []).filter(function(o){ return !(o.noteId === c.noteId && o.viewer === c.viewer); });
      if(c.on) S.comments.push(cmtOf(c));
    });
  }
  afterRemote();
}
/* サーバーの 整理役（のこり ミリ秒）を この 端末の 時刻に なおして 持つ */
function setOrg(m){

  if(isTeacher()) S.org = o; else { S.org = S.org || {}; S.org[myTeam()] = o[myTeam()]; if(!o[myTeam()]) delete S.org[myTeam()]; }
}
function cmtOf(c){ return {noteId:c.noteId, viewer:c.viewer, text:String(c.text || '')}; }
/* 班の メンバーごとの いいねシール（番号順。最大5人）：緑・赤・青・黄・紫（tools/make-stickers.cjs の VARIANT） */

function starOf(s){ var o = {noteId:s.noteId, viewer:s.viewer, k:kindOf(s), rd:rdOf(s)}; if(s.slot != null) o.slot = s.slot; if(s.x != null){ o.x = s.x; o.y = s.y; o.r = s.r; } return o; }

/* ===== 検索（端末の中だけで 探す。児童は 自分の班だけ） ===== */
/* kind：'' しぼらない／'any' どれか ある／種類名 その種類が ある */
function searchHits(team, q, kind){
  q = String(q || '').trim();
  var words = q ? q.split(/[\s　]+/) : [];
  return S.items.filter(function(n){
    if(n.kind !== 'note' || (team && n.team !== team)) return false;
    if(kind === 'thumb' && !likesOf(n.id).length) return false;
    if(kind && kind !== 'thumb' && !starsOf(n.id).some(function(s){ return kind === 'any' || kindOf(s) === kind; })) return false;
    return words.every(function(w){ return String(n.text).indexOf(w) >= 0; });
  }).sort(function(a, b){ return kind ? cnt(b) - cnt(a) : 0; });

function sortHits(list, k){
  var a = list.slice();
  if(k === 'new') a.sort(function(x, y){ return writtenAt(y) - writtenAt(x); });

var STAR_PER_TEAM = 2;

function usedIn(team, k){ var r = curRound(team); return S.stars.filter(function(s){ var n = item(s.noteId); return s.viewer === me && kindOf(s) === k && rdOf(s) === r && n && n.team === team; }).length; }
function quotaOf(k){ var K = KINDS.filter(function(x){ return x.k === k; })[0]; return (K && K.quota) || STAR_PER_TEAM; }
function leftIn(team, k){ return Math.max(0, quotaOf(k) - usedIn(team, k)); }

function jit(key, px, deg){
  var h = 2166136261; for(var i = 0; i < key.length; i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }

function noteHTML(n, opt){

/* 枠の タイトルの 位置：枠の 辺の 上を 一周 0〜1 で もつ（左上から 時計まわり） */
function edgePoint(W, H, lp){
  var P = 2*(W + H), t = ((lp % 1) + 1) % 1 * P;
  if(t <= W) return {x:t, y:0};
  if(t <= W + H) return {x:W, y:t - W};
  if(t <= 2*W + H) return {x:W - (t - W - H), y:H};
  return {x:0, y:H - (t - 2*W - H)};
}
function edgeParam(W, H, px, py){
  var cx = Math.max(0, Math.min(W, px)), cy = Math.max(0, Math.min(H, py)), P = 2*(W + H);
  var d = [Math.abs(py), Math.abs(W - px), Math.abs(H - py), Math.abs(px)], m = d.indexOf(Math.min.apply(null, d));
  var t = m === 0 ? cx : m === 1 ? W + cy : m === 2 ? W + H + (W - cx) : 2*W + H + (H - cy);
  return t / P;
}
function labelStyle(f, W, H){
  if(f.lp == null) return '';
  var p = edgePoint(W, H, f.lp); return ' style="left:' + p.x.toFixed(1) + 'px;top:' + p.y.toFixed(1) + 'px"';
}

    + '<div class="label' + (f.lp == null ? '' : ' onedge') + '" data-label="' + f.id + '"' + labelStyle(f, f.w*GRID, f.h*GRID) + '>' + esc(f.text || '') + '</div>' + (canArrange() ? '<div class="grip" data-grip="' + f.id + '"></div>' : '') + '</div>';
}
function center(x){
  if(x.kind === 'frame') return {x:(x.x + x.w/2)*GRID, y:(x.y + x.h/2)*GRID};
  return {x:(x.x + NOTE_W/2)*GRID, y:(x.y + NOTE_H/2)*GRID};
}
/* 中心から 向き(dx,dy) に進んで 四角の ふちに 当たるまでの 距離 */
function edge(x, dx, dy){
  var hw = (x.kind === 'frame' ? x.w : NOTE_W) * GRID / 2, hh = (x.kind === 'frame' ? x.h : NOTE_H) * GRID / 2;
  var L = Math.sqrt(dx*dx + dy*dy) || 1, ux = Math.abs(dx/L), uy = Math.abs(dy/L);
  return Math.min(ux ? hw/ux : 1e9, uy ? hh/uy : 1e9);
}
function arrowsSVG(list){
  var s = '<svg class="arrows"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker></defs>';
  list.forEach(function(a){
    var A = item(a.from), B = item(a.to);
    if(!A || !B) return; // 同期の途中で 片方が まだ 届いていない
    var p = center(A), q = center(B);
    var dx = q.x - p.x, dy = q.y - p.y, L = Math.sqrt(dx*dx + dy*dy) || 1;
    var c1 = edge(A, dx, dy) + 10, c2 = edge(B, dx, dy) + 14;
    var x1 = p.x + dx/L*c1, y1 = p.y + dy/L*c1, x2 = q.x - dx/L*c2, y2 = q.y - dy/L*c2;
    s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#ah)"/>'
       + '<line class="hit" data-arrow="' + a.id + '" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
  });
  return s + '</svg>';
}

/* 先生が「シール（班の外）」を入れたら、その組の 全児童が この画面になる（範囲：同じ組／学年）。
   ほかの班の「見てほしい付箋」を大きく並べ、選んだシールを 付箋の好きな場所に 貼る。
   人気への同調を避けるため、ほかの子の シールは 見せない（集計は 班のボードに 出る）。班の順番は 子どもごとに ばらばら。 */
function shuffled(arr, seed){
  var a = arr.slice(), h = 0; for(var i = 0; i < seed.length; i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  for(var j = a.length - 1; j > 0; j--){ h = (h*1103515245 + 12345) >>> 0; var t = h % (j + 1), x = a[j]; a[j] = a[t]; a[t] = x; }
  return a;
}

/* 大きい 付箋で 直した 文を 保存する（とじる・ほかの ボタンを 押した 時）。空に したら もとの 文の まま */
function flushNote(){
  var s = ui.sheet, n = s && item(s.id);
  if(!n || !(canEdit() || isTeacher()) || n.face === 'trash') return;
  var t = s.text != null ? String(s.text).trim().slice(0, 200) : '', a = s.ans != null ? String(s.ans).replace(/\s+$/, '').slice(0, 400) : null;
  var newT = t && t !== n.text, newA = a !== null && a !== (n.ans || '');
  if(!newT && !newA) return;
  commit(function(){ var x = item(s.id); if(newT) x.text = t; if(newA){ if(a) x.ans = a; else delete x.ans; } });
  if(newT) s.text = t;
}

/* ===== 先生 ===== */
function classes(){ var o = []; SPOTS.forEach(function(s){ if(o.indexOf(s.cls) < 0) o.push(s.cls); }); return o; }
function faceLabel(k){ return FACES.filter(function(f){ return f.k === k; })[0].label; }
/* 意見の一覧（1行＝付箋1まい）。書いた児童は 入れない（外部AIに 個人を 渡さない） */
function opinionRows(){
  var hit = {}; searchHits(null, ui.fQ, ui.fKind).forEach(function(n){ hit[n.id] = 1; });
  var tag = ui.fTag || '', team = ui.fTeam || 'all';
  var rows = S.items.filter(function(n){
    return n.kind === 'note' && hit[n.id] && (ui.fCls === 'all' || clsOf(n.team) === ui.fCls) && (team === 'all' || n.team === team)
      && (ui.fFace === 'all' ? n.face !== 'trash' : n.face === ui.fFace)
      && (!tag || (tag === 'kb' ? n.kb : tag === 'done' ? n.done : tag === 'show' ? shownNow(n) : tag === 'ans' ? !!n.ans : true));
  });
  /* ならべかた：班ごと（ボードの 上から）／シールの 多い順／書いた 順／あいうえお順。どれも まず 班の 順 */
  var order = {}; SPOTS.forEach(function(s, i){ order[s.team] = i; });
  var sort = ui.fSort || 'board', nst = function(n){ return allStarsOf(n.id).filter(function(x){ return kindOf(x) !== 'thumb'; }).length; };
  rows.sort(function(a, b){
    var t = order[a.team] - order[b.team]; if(t) return t;
    if(sort === 'stars') return nst(b) - nst(a) || (a.y - b.y) || (a.x - b.x);
    if(sort === 'time') return writtenAt(a) - writtenAt(b);
    if(sort === 'aiueo') return JA.compare(String(a.text), String(b.text));
    return (a.y - b.y) || (a.x - b.x);
  });
  /* まとまり番号：重なりの いちばん上と その下の 付箋に 同じ 番号 */
  var grp = {}, gno = 0;
  rows.forEach(function(n){ var top = n.stackOf ? n.stackOf : (stackOf(n.id).length ? n.id : null); if(top && !grp[top]) grp[top] = ++gno; });
  return rows.map(function(n){
    var s = spot(n.team), top = n.stackOf ? n.stackOf : (stackOf(n.id).length ? n.id : null);
    // しらべた人の 名前は 入れない（外部AIに 個人名を 渡さない）。コメントは 選んだ 時だけ
    return [s.cls + '組', s.no + 'はん', s.name, faceLabel(n.face), n.text, n.done ? '○' : '', n.kb ? '○' : '', n.ans || '', showRound(n) ? '第' + showRound(n) + '回' : '',
      sealSummary(n), likesOf(n.id).length || '', top ? grp[top] + (n.stackOf ? '' : '（上）') : '', n.fromTeam ? teamLabel(n.fromTeam) : '']
      .concat(ui.fCmt ? [commentsOf(n.id).map(function(c){ return c.text; }).join(' / ')] : []);
  });
}
/* シールを 全部の 回で（いいねは 別の 列）：第1回 星2 流れ星1 ／ 第2回 … */

  return Object.keys(by).sort(function(a, b){ return a - b; }).map(function(r){ return '第' + r + '回 ' + KINDS.filter(function(K){ return by[r][K.k]; }).map(function(K){ return K.name + by[r][K.k]; }).join(' '); }).join(' ／ ');

/* もどせない 操作は 2回 押し。1回目で ボタンが 赤く なり、何が 起きるかを 横に 出す（5秒で もとに もどる） */

/* 先生：見合い会の 進め方（開いた 人数 → はじめる → 自動で 班が 進む → おわると 全員 ボードへ） */

/* ===== ドラッグ ===== */
var drag = null;
function boardPoint(e){ var b = $id('board').getBoundingClientRect(); return {x:e.clientX - b.left, y:e.clientY - b.top}; }
function noteAt(pt, exceptId){
  var found = null;
  $qa('#board .note').forEach(function(el){
    if(el.getAttribute('data-id') === exceptId) return;
    var r = el.getBoundingClientRect(), b = $id('board').getBoundingClientRect();
    var x = pt.x + b.left, y = pt.y + b.top;
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) found = el.getAttribute('data-id');
  });
  return found;
}
function faceAt(e){
  var f = null;
  $qa('.face[data-face]').forEach(function(el){
    var r = el.getBoundingClientRect();
    if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) f = el.getAttribute('data-face');

}
document.addEventListener('pointerdown', function(e){

  drag = {id:x.id, el:el, sx:e.clientX, sy:e.clientY, ox:x.x, oy:x.y, ow:x.w, oh:x.h, moved:false, grip:!!grip, cicon:!!e.target.closest('.cicon'), curl:!!e.target.closest('.curl'), label:lab};

document.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx = (e.clientX - drag.sx) / Z, dy = (e.clientY - drag.sy) / Z;
  if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 8 / Z) return;
  if(!canEdit() || ui.tool === 'arrow' || ui.face === 'trash') return;
  if(!canArrange()){ if(!drag.warned){ drag.warned = true; toast(orgHint()); } return; }
  drag.moved = true;
  if(drag.label){
    /* タイトルは 枠の 辺の 上だけを うごく */
    var fr = drag.el.getBoundingClientRect(), W0 = drag.ow*GRID, H0 = drag.oh*GRID;
    drag.lp = edgeParam(W0, H0, (e.clientX - fr.left) / Z, (e.clientY - fr.top) / Z);
    var ep = edgePoint(W0, H0, drag.lp);
    drag.label.classList.add('onedge', 'dragging'); drag.label.style.left = ep.x + 'px'; drag.label.style.top = ep.y + 'px';
    return;
  }
  if(drag.grip){
    drag.el.style.width = Math.max(4*GRID, Math.min((boardCols() - clampX(drag.ox, drag.ow) - 1)*GRID, drag.ow*GRID + dx)) + 'px';
    drag.el.style.height = Math.max(3*GRID, drag.oh*GRID + dy) + 'px';
    return;
  }
  drag.el.classList.add('dragging');
  drag.el.style.left = (clampX(drag.ox, drag.ow)*GRID + dx) + 'px'; drag.el.style.top = (drag.oy*GRID + dy) + 'px';
  var x = item(drag.id);
  if(x && x.kind === 'note'){
    var t = noteAt(boardPoint(e), drag.id);
    document.querySelectorAll('.note.target').forEach(function(n){ n.classList.remove('target'); });
    if(t){ var tel = $q('#board .note[data-id="' + t + '"]'); if(tel) tel.classList.add('target'); }

  }
});
document.addEventListener('pointerup', function(e){
  if(!drag) return;
  var d = drag; drag = null;
  var x = item(d.id);
  if(!x){ render(); return; } // 動かしている間に 同期で 消えた
  if(!d.moved){ if(d.cicon){ ui.sheet = {type:'cmts', id:x.id}; render(); return; } if(d.curl){ ui.sheet = {type:'note', id:x.id, side:'back'}; render(); return; } tapItem(x); return; }
  var dx = (e.clientX - d.sx) / Z, dy = (e.clientY - d.sy) / Z;
  if(d.label){ commit(function(){ x.lp = Math.round(d.lp * 1000) / 1000; }); return; }
  if(d.grip){ commit(function(){ x.w = Math.max(4, Math.min(boardCols() - clampX(d.ox, d.ow) - 1, Math.round(d.ow + dx/GRID))); x.h = Math.max(3, Math.round(d.oh + dy/GRID)); }); return; }
  var f = x.kind === 'note' ? faceAt(e) : null;
  var t = x.kind === 'note' ? noteAt(boardPoint(e), d.id) : null;
  if(f && f !== ui.face && f !== 'gift' && x.kb){ var ks = kbOf(x.team, x.face); ks.forEach(function(k){ moveFace(k, f); }); toast(ks.length + 'まいを ' + faceLabel(f) + 'へ うつしました'); return; }
  if(f && f !== ui.face && f !== 'gift'){ moveFace(x, f); return; }
  if(x.kb){ var nx = clampX(Math.round(clampX(d.ox, NOTE_W) + dx/GRID), NOTE_W), ny = Math.max(0, Math.round(d.oy + dy/GRID)); commit(function(){ kbOf(x.team, x.face).forEach(function(k){ k.x = nx; k.y = ny; }); }); return; }
  if(t && item(t) && item(t).kb){ setKb(x, true); toast('「みんなに 知っていて ほしいこと」に 入れました'); return; }
  if(t && item(t)){ stackOnto(x, item(t)); return; }
  commit(function(){ x.x = clampX(Math.round(clampX(d.ox, x.w) + dx/GRID), x.kind === 'frame' ? x.w : NOTE_W); x.y = Math.max(0, Math.round(d.oy + dy/GRID)); });
});

function stackOnto(x, target){
  commit(function(){
    stackOf(x.id).forEach(function(k){ k.stackOf = target.id; });
    x.stackOf = target.id; x.pick = 0;
    dropArrows(x.id);
  });
  toast((stackOf(target.id).length + 1) + 'まい 重なりました');
}
function moveFace(x, f){
  commit(function(){
    if(f === 'trash' && x.kb){ delete x.kb; delete x.kbAt; var fp = freeSpot(x.team, x.face); x.x = fp.x; x.y = fp.y; }  // ゴミばこへ 入れると 青い 山から はずれる（もどすと ふつうの 付箋）
    x.face = f; x.pick = 0; x.stackOf = null;
    stackOf(x.id).forEach(function(k){ k.face = f; });

  });

function dropArrows(id){ S.items = S.items.filter(function(a){ return !(a.kind === 'arrow' && (a.from === id || a.to === id)); }); }
function tapItem(x){

/* 板の 列数（方眼の 数）。画面の 幅から 決める */
function boardCols(){
  /* 左の 道具の 列（64＋あいだ）・まわりの 余白・枠線・たてスクロールバーの 分を 引く */
  var w = paneW() - (isMine() && ui.face !== 'trash' ? 12 + 64 + 12 : 12) - 12 - 4 - 18;
  return Math.max(NOTE_W + 2, Math.floor(w / GRID));
}
function clampX(x, w){ return Math.max(0, Math.min(x, boardCols() - (w || NOTE_W) - 1)); }
function perRow(){ return Math.max(1, Math.floor((boardCols() - 1) / (NOTE_W + 1))); }
function freeSpot(team, face){
  var used = S.items.filter(function(x){ return x.team === team && x.face === face && x.kind === 'note' && !x.stackOf; });
  for(var r = 0; r < 100; r++) for(var c = 0; c < perRow(); c++){
    var gx = 1 + c*(NOTE_W + 1), gy = 1 + r*(NOTE_H + 1);
    if(!used.some(function(u){ return Math.abs(u.x - gx) < NOTE_W && Math.abs(u.y - gy) < NOTE_H; })) return {x:gx, y:gy};
  }
  return {x:1, y:1};
}

  [['ホームベースは 何こ あるの？', 3], ['あした 見に いける？', 2]].forEach(function(p){ S.items.push({id:nid(), kind:'note', team:'A-1', face:'trash', x:1, y:1, text:p[0], author:'A02', t:now - p[1] * day}); });
  S.modes.A.view = 'class'; S.modes.A.propose = 'class'; S.modes.A.orgMin = 5; S.modes.A.rot = null;
  Platform.push(null);
}

/* ===== 見本・書き出し ===== */
function seed(){
  var Q = [
    ['どうして うめたの？','いつ なくなったの？','ホームベースは 本物なの？','だれが きめたの？','どうして 野球場が なくなったの？'],
    ['どうして 石が ちがうの？','甲山は 火山なの？','だれが 名前を つけたの？','どうして おわんの 形なの？'],
    ['どうして 使わなかったの？','だれが 作ったの？','どうして 海の そばに あるの？','中に 入れるの？'],
    ['どうして 重要文化財に なったの？','だれが たてたの？','今も 使っているの？'],
    ['どうして 街灯を けしたの？','ホタルは 何びき いるの？','ポスターは だれが かいたの？','どうして 小学生の 声が とどいたの？'],
    ['どうして 日本じゅうに 広まったの？','今も 人形は あるの？','だれが はじめたの？'],
    ['どうして お酒屋さんが 建てたの？','今も 光るの？','いつ 建てたの？','国は どうして 建てなかったの？']
  ];
  commit(function(){
    SPOTS.forEach(function(s){
      if(S.items.some(function(x){ return x.team === s.team; })) return;
      var members = S.roster.filter(function(c){ return c.team === s.team; });
      if(!members.length) return;
      Q[(s.no - 1) % Q.length].forEach(function(t, i){
        S.items.push({id:nid(), kind:'note', team:s.team, face:'front', x:1 + (i%4)*(NOTE_W+1), y:2 + Math.floor(i/4)*(NOTE_H+2), text:t, author:members[i % members.length].id, mark:i%3 === 1 ? 1 : 0, showcase:i < 4 ? 1 : 0});
      });
      S.items.push({id:nid(), kind:'note', team:s.team, face:'back', x:1, y:1, text:'どこに あるの？', author:members[0].id});
    });
  });
  toast('見本の 付箋を 入れました');
}
function csv(){
  var rows = [['組','班','面','付箋','書いた人','おくり元','もう知ってる（しらべた人）','知っててほしい','わかったこと（うら）','重ねた先','見てほしい'].concat(KINDS.map(function(K){ return K.name; })).concat(['コメント','回ごとの シール'])];
  S.items.filter(function(x){ return x.kind === 'note'; }).forEach(function(n){
    var c = child(n.author), p = n.stackOf ? item(n.stackOf) : null, s = spot(n.team);
    rows.push([s.cls, s.no, faceLabel(n.face), n.text, c ? c.no : '', n.fromTeam ? teamLabel(n.fromTeam) : '', n.done ? (n.doneBy || '○') : '', n.kb ? '○' : '', n.ans || '', p ? p.text : '', showRound(n) ? '第' + showRound(n) + '回' : ''].concat(kindCounts(n)).concat([commentsOf(n.id).map(function(x){ var w = child(x.viewer); return (w ? teamLabel(w.team) + ' ' + w.no + 'ばん：' : '') + x.text; }).join(' / '), roundSummary(n)]));
  });
  var body = '﻿' + rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type:'text/csv'})); a.download = 'toiboard.csv'; a.click();
}

/* 見合い会：時刻で 班が 切り替わったら 描き直して 取りに 行く。のこり時間の 文字は 毎秒 */
var rotKeys = {};  // 組ごとに 覚える（見本の 切り替えや 2画面で 人が 変わっても 切り替わりと まちがえない）
setInterval(function(){
  if(!S) return;
  var cls = isTeacher() ? ui.tCls : myCls(), st = rotState(cls), k = st.phase + '|' + (st.team || '');
  if(k !== rotKeys[cls]){ var first = !(cls in rotKeys); rotKeys[cls] = k; if(!first && !drag){ ui.selSeal = null; if(!isTeacher() && ui.sheet && (ui.sheet.type === 'cmt' || running(st))) ui.sheet = null; render(); if(Platform.kick) Platform.kick(); } return; }
  if(running(st)) document.querySelectorAll('.rotleft').forEach(function(el){ el.textContent = mmssLeft(st); });
}, 1000);
setInterval(function(){
  if(!S || !S.org) return;
  var any = false, expired = false;
  Object.keys(S.org).forEach(function(t){ var o = S.org[t], end = o && (o.end || o.until); if(!end) return; if(end > Date.now()) any = true; else if(!o.gone){ o.gone = true; expired = true; } });
  if(expired && !drag){ render(); return; }
  if(any) document.querySelectorAll('.orgleft').forEach(function(el){ var t = el.getAttribute('data-t') || myTeam(), o = orgOf(t); if(o) el.textContent = mmss(o.end - Date.now()); });
}, 1000);
Platform.start(function(s, who, spots, info){ S = s; S.comments = S.comments || []; S.org = S.org || {}; if(window.__bootOrg){ me = who; setOrg(window.__bootOrg); } me = who; if(info && info.mates){ S.mates = {}; S.mates[info.team] = info.mates; }
  if(TRIAL && !S.items.length){ trialSeed(); trialGo(0); return; }
  if(TRIAL) TRIAL_ST.n = 0; if(spots) SPOTS = spots; if(info && info.cls) ui.tCls = info.cls; var c = child(me); if(!c && classes().indexOf(ui.tCls) < 0) ui.tCls = classes()[0]; render(); });
</script>
