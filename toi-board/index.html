<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>といボード</title>
<style>
:root{
  --ink:#1A1A1A; --sub:#55585E; --line:#D5D8DD; --paper:#F7F7F4; --white:#fff;
  --cat-1:#0F5EA8; --cat-2:#C86A00; --cat-3:#6E4310;
  --fill-a:#D7E8F8; --fill-b:#FBE3B4; --gift:#E6F2DD; --gold:#E0A43A;
  --grid:24px;
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--white);font-weight:700}
.btn.on{border-color:var(--cat-1);background:var(--fill-a)}
.btn.primary{background:var(--cat-1);border-color:var(--cat-1);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.demo{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub)}
.demo select{font-size:14px;padding:4px}

/* 上の帯 */
.head{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0 8px 0 0}
.faces{display:flex;gap:6px}
.face{min-height:52px;min-width:96px;padding:0 12px;border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;background:#fff;font-weight:700;font-size:17px}
.face.on{border-color:var(--ink)}
.face.drop{background:var(--fill-a);border-color:var(--cat-1)}
.face .n{font-size:13px;color:var(--sub);margin-left:4px}
.modes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:6px;padding:0 12px 8px;align-items:center;flex-wrap:wrap}
.tools .hint{font-size:14px;color:var(--sub);margin-left:6px}
.viewing{background:#FFF4D6;border:2px solid var(--cat-2);border-radius:12px;padding:6px 12px;margin:0 12px 8px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ボード */
.wrap{position:relative;margin:0 12px 12px;height:calc(100vh - 190px);min-height:420px;overflow:auto;border:2px solid var(--line);border-radius:12px;background:#fff;touch-action:pan-x pan-y}
.board{position:relative;width:2016px;height:6240px;
  background-image:
    linear-gradient(to right, rgba(15,94,168,.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(15,94,168,.10) 1px, transparent 1px);
  background-size:var(--grid) var(--grid);}
.board.back{background-color:#E4E4E1}
.board.gift{background-color:#E8D6BE}
.board.trash{background-color:#DDEBF7}
.face[data-face=back]{background:#F0F0EE}
.face[data-face=gift]{background:#F4EADC}
.face[data-face=trash]{background:#EAF2FA}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.arrows line{stroke:var(--ink);stroke-width:4;pointer-events:stroke;cursor:pointer}
svg.arrows line.hit{stroke:transparent;stroke-width:28}

.item{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none}
.note.has-seal{padding-bottom:76px}
.note.has-mark{padding-right:34px}
.note.has-seal.one{padding-bottom:44px}
.note{width:168px;min-height:120px;padding:14px 12px 22px;background:var(--fill-b);box-shadow:0 2px 4px rgba(0,0,0,.15);font-size:18px;font-weight:700;line-height:1.45;word-break:break-all;border-radius:2px}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:70px;height:16px;margin-left:-35px;background:rgba(255,255,255,.65);box-shadow:0 0 1px rgba(0,0,0,.2)}
.note.gift{background:var(--gift)}
.note.dragging{box-shadow:0 10px 20px rgba(0,0,0,.25);z-index:50;transform:rotate(-2deg)}
.note.target{outline:4px solid var(--cat-1);outline-offset:4px}
.note.sel{outline:4px dashed var(--cat-2);outline-offset:4px}
.layer{position:absolute;inset:0;background:var(--fill-b);border:1px solid rgba(0,0,0,.18);border-radius:2px;z-index:-1}
.note.gift .layer{background:var(--gift)}
.from{display:block;margin-top:4px;font-size:12px;color:var(--cat-3)}
.mark{position:absolute;right:6px;top:4px;display:flex;gap:4px;align-items:center}
.mark svg{width:22px;height:22px}
.pick{position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;display:grid;place-items:center}
.stars{position:absolute;left:6px;right:6px;bottom:2px;height:66px;pointer-events:none}
.stars.one{height:34px}
.stars img{width:30px;height:30px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.stars .slot{position:absolute;transform:translateX(-50%)}
.stars .rot{display:block;transform:rotate(var(--r,0deg))}
.stars .slot,.hit .sc{display:flex;align-items:center}
.hit .sc{position:relative}
/* 数は シールの 右下に 重ねて 出す（横に 並べても 幅が 増えない） */
.cnt{position:absolute;right:-7px;bottom:-6px;font-size:14px;font-weight:900;line-height:1;color:#fff;-webkit-text-stroke:3px #1A1A1A;paint-order:stroke fill;text-shadow:0 0 1px #1A1A1A;white-space:nowrap;pointer-events:none;transform:none}
.show{position:absolute;left:8px;top:-14px;background:#0F5EA8;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
/* シール貼り（ほかの班）画面 */
.gal{padding:12px 16px 80px}
.gal-head{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;background:var(--paper)}
.gal-head h1{font-size:22px;margin:0}
.kpick{width:64px;height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;display:grid;place-items:center}
.kpick.on{border-color:var(--cat-1);background:var(--fill-a)}
.kpick img{width:46px;height:46px;pointer-events:none}
.gteam{margin:18px 0 8px;font-size:18px}
.gnotes{display:flex;flex-wrap:wrap;gap:28px}
.big{position:relative;width:240px;min-height:200px;padding:24px 16px 76px;background:var(--fill-b);box-shadow:0 2px 5px rgba(0,0,0,.18);font-size:21px;font-weight:700;line-height:1.5;word-break:break-all;border-radius:2px;cursor:pointer}
.big::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:18px;margin-left:-42px;background:rgba(255,255,255,.65);box-shadow:0 0 1px rgba(0,0,0,.2)}
.seal{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px}
.seal img{width:100%;height:100%;display:block;pointer-events:none}
.seal.sel{filter:drop-shadow(0 0 3px #0F5EA8)}
.peel{position:absolute;right:-30px;top:-30px;min-height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:99px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap;z-index:5}
@keyframes stick{0%{transform:scale(1.5) rotate(var(--r))}60%{transform:scale(.9) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r))}}
.seal.new{animation:stick .28s ease-out}
.frame{border:3px dashed var(--cat-3);border-radius:10px;background:rgba(251,227,180,.12)}
.frame .label{position:absolute;left:8px;top:-15px;background:#fff;padding:0 6px;font-weight:700;font-size:16px;color:var(--cat-3);min-width:40px;min-height:24px}
.frame .grip{position:absolute;right:-14px;bottom:-14px;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--cat-3)}
.empty{position:absolute;left:40px;top:40px;color:var(--sub);font-size:18px}

/* 下から出る操作 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(720px,100%);border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{min-height:56px}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--ink);border-radius:10px;min-height:96px}
.stacklist{display:flex;gap:10px;flex-wrap:wrap}
.stacklist .note{position:relative}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:200}

/* 先生 */
.teacher{padding:12px;max-width:1100px}
.teacher h2{font-size:18px;margin:18px 0 8px}
.mode{display:flex;align-items:center;gap:10px;margin:6px 0}
.mode .btn{min-width:220px;text-align:left}
table{border-collapse:collapse;font-size:14px;background:#fff}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:left}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stars.pop svg{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<style>
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;min-width:84px;border:0;border-right:1px solid var(--line);background:#fff;font-weight:700}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.net{position:fixed;right:12px;bottom:12px;background:#FFF4D6;border:2px solid var(--cat-2);border-radius:10px;padding:6px 12px;font-weight:700;z-index:150}
.net:empty{display:none}
.ttable{max-height:60vh;overflow:auto;border:1px solid var(--line)}
.ttable td.text{min-width:260px}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ctabs{display:flex;gap:6px;margin:6px 0}
.sbox{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--ink);border-radius:10px}
.hits{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hit{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;text-align:left;min-height:56px}
.hit .t{flex:1;font-size:18px;font-weight:700}
.hit .w{font-size:13px;color:var(--sub);white-space:nowrap}
.note.flash{outline:5px solid var(--cat-2);outline-offset:6px}
</style>
<div id="app"></div>
<div id="net" class="net"></div>
<script>
/* ===== 語彙 ===== */
var VER = 3, API_WANT = 3, GRID = 24, NOTE_W = 7, NOTE_H = 5;
var FACES = [
  {k:'front', label:'表がわ'},
  {k:'back',  label:'うらがわ'},
  {k:'gift',  label:'いただきもの'},
  {k:'trash', label:'ゴミばこ'}
];
var MARKS = ['', 'ひとことで 答えられる', 'せつめいが いる'];
/* 班は「組-番号」で 学年の中で 一意（例 A-3）。本番は スプレッドシートの「スポット」から 読む */
var SPOTS = (function(){
  var N = {
    A:['阪急西宮北口','甲山','西宮砲台','神戸女学院','有馬川','えびすかき','今津灯台'],
    B:['甲子園球場','西宮神社','御前浜・香櫨園浜','名塩和紙','ヨットハーバー','廣田神社','夙川'],
    C:['甲子園浜','甑岩','今津六角堂','貝類館','高木地区','金仙寺湖','武庫川']
  }, out = [];
  Object.keys(N).forEach(function(c){ N[c].forEach(function(n, i){ out.push({team:c + '-' + (i + 1), cls:c, no:i + 1, name:n}); }); });
  return out;
})();
var SCOPES = [{k:'off', label:'切'}, {k:'class', label:'同じ組'}, {k:'grade', label:'学年'}];
var MODES = [
  {k:'view',    label:'共同閲覧',          desc:'ほかの班の 表がわを 見られる',                 scoped:true},
  {k:'propose', label:'アイデア提案',      desc:'ほかの班の「いただきもの」に 付箋を 貼れる',   scoped:true},
  {k:'starIn',  label:'シール（班の中）',  desc:'自分の班の 付箋に シールを 貼れる',           scoped:false},
  {k:'starOut', label:'シール（班の外）',  desc:'児童の画面が、ほかの班の「見てほしい付箋」に シールを 貼る画面に 切り替わる', scoped:true}
];
function blankModes(){ return {view:'off', propose:'off', starIn:false, starOut:'off'}; }

/* ===== 保存（見本：localStorage。GAS版は build で この区間を 差し替える） ===== */
'PLATFORM_BEGIN';
var KEY = 'toiboard.v3';
function fresh(){
  var roster = [];
  ['A','B','C'].forEach(function(c){
    for(var i = 1; i <= 28; i++) roster.push({id:c + (i < 10 ? '0' : '') + i, cls:c, no:i, team:c + '-' + Math.ceil(i / 4)});
  });
  return {ver:VER, roster:roster, items:[], stars:[], modes:{A:blankModes(), B:blankModes(), C:blankModes()}};
}
var Platform = {
  demo:true,
  start:function(cb){
    var s = null, who = 'A01';
    try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    if(!s || s.ver !== VER) s = fresh();
    try{ who = localStorage.getItem(KEY + '.me') || 'A01'; }catch(e){}
    cb(s, who, null);
    window.addEventListener('storage', function(e){
      if(e.key !== KEY) return;
      try{ S = JSON.parse(localStorage.getItem(KEY)) || fresh(); }catch(err){ S = fresh(); }
      afterRemote();
    });
  },
  push:function(ops){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} },
  setMe:function(v){ try{ localStorage.setItem(KEY + '.me', v); }catch(e){} },
  watch:function(){}
};
'PLATFORM_END';

var S = null, me = null;
var ui = {face:'front', viewTeam:null, tool:'move', arrowFrom:null, sheet:null, toast:'', tCls:'A', tTeam:'A-1', armed:false, pop:null, fCls:'all', fFace:'front'};

function child(id){ return S.roster.filter(function(c){ return c.id === id; })[0]; }
function isTeacher(){ return !child(me); }
function myTeam(){ var c = child(me); return c ? c.team : ''; }
function myCls(){ var c = child(me); return c ? c.cls : ui.tCls; }
function clsOf(team){ return String(team).split('-')[0]; }
function boardTeam(){ return isTeacher() ? ui.tTeam : (ui.viewTeam || myTeam()); }
function isMine(){ return !isTeacher() && boardTeam() === myTeam(); }
function spot(t){ return SPOTS.filter(function(s){ return s.team === t; })[0] || {team:t, cls:clsOf(t), no:String(t).split('-')[1], name:t}; }
/* 同じ組なら「3はん」、ほかの組なら「B組3はん」 */
function teamLabel(t){ var s = spot(t); return (isTeacher() || s.cls !== myCls() ? s.cls + '組' : '') + s.no + 'はん'; }
function item(id){ return S.items.filter(function(x){ return x.id === id; })[0]; }
function stackOf(id){ return S.items.filter(function(x){ return x.stackOf === id; }); }
function starsOf(id){ return S.stars.filter(function(s){ return s.noteId === id; }); }
function kindOf(s){ return s.k || 'star'; }
function nid(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function M(){ return (S.modes && S.modes[myCls()]) || blankModes(); }
function modeOn(v){ return !!v && v !== 'off'; }
/* その班まで 届くか（範囲つきモード） */
function reach(k, team){ var v = M()[k]; return v === 'grade' || (v === 'class' && clsOf(team) === myCls()); }

/* 変更は 差分にして Platform へ渡す（GAS版は 差分だけ 送る） */
function snap(){
  var m = {}, st = {};
  S.items.forEach(function(x){ m[x.id] = JSON.stringify(x); });
  S.stars.forEach(function(s){ st[s.noteId + '|' + kindOf(s) + '|' + s.viewer] = JSON.stringify(s); });
  return {m:m, st:st, modes:JSON.stringify(S.modes)};
}
var hist = {undo:[], redo:[]};
function commit(fn, noHist){
  var b = snap(); fn(); check();
  if(!noHist) remember(b);
  var ops = {up:[], del:[], star:[], modes:null}, now = {}, st = {};
  S.items.forEach(function(x){ now[x.id] = 1; var j = JSON.stringify(x); if(b.m[x.id] !== j) ops.up.push(JSON.parse(j)); });
  Object.keys(b.m).forEach(function(id){ if(!now[id]) ops.del.push(id); });
  S.stars.forEach(function(s){
    var k = s.noteId + '|' + kindOf(s) + '|' + s.viewer; st[k] = 1;
    if(s.viewer === me && b.st[k] !== JSON.stringify(s)) ops.star.push({noteId:s.noteId, k:kindOf(s), on:true, x:s.x, y:s.y, r:s.r});
  });
  Object.keys(b.st).forEach(function(k){ var p = k.split('|'); if(!st[k] && p.slice(2).join('|') === me) ops.star.push({noteId:p[0], k:p[1], on:false}); });
  if(JSON.stringify(S.modes) !== b.modes) ops.modes = {cls:ui.tCls, m:S.modes[ui.tCls]};
  Platform.push(ops);
  render();
}
/* 変わった 付箋・シールだけ 前と後を 覚える（ほかの人の 変更は 巻き戻さない）。モードは 対象外 */
function remember(b){
  var a = snap(), e = {before:{m:{}, st:{}}, after:{m:{}, st:{}}}, n = 0;
  Object.keys(b.m).concat(Object.keys(a.m)).forEach(function(id){ if(b.m[id] !== a.m[id] && !(id in e.before.m)){ e.before.m[id] = b.m[id] || null; e.after.m[id] = a.m[id] || null; n++; } });
  Object.keys(b.st).concat(Object.keys(a.st)).forEach(function(k){ if(b.st[k] !== a.st[k] && !(k in e.before.st)){ e.before.st[k] = b.st[k] || null; e.after.st[k] = a.st[k] || null; n++; } });
  if(!n) return;
  hist.undo.push(e); if(hist.undo.length > 50) hist.undo.shift();
  hist.redo = [];
}
function putBack(state){
  Object.keys(state.m).forEach(function(id){
    S.items = S.items.filter(function(x){ return x.id !== id; });
    if(state.m[id]) S.items.push(JSON.parse(state.m[id]));
  });
  Object.keys(state.st).forEach(function(k){
    S.stars = S.stars.filter(function(s){ return s.noteId + '|' + kindOf(s) + '|' + s.viewer !== k; });
    if(state.st[k]) S.stars.push(JSON.parse(state.st[k]));
  });
  S.items.forEach(function(x){ if(x.stackOf && !item(x.stackOf)) x.stackOf = null; });
  S.items = S.items.filter(function(a){ return a.kind !== 'arrow' || (item(a.from) && item(a.to)); });
}
function undo(){
  var e = hist.undo.pop(); if(!e){ toast('もどせる 操作は ありません'); return; }
  ui.sheet = null; commit(function(){ putBack(e.before); }, true); hist.redo.push(e); toast('もとに もどしました');
}
function redo(){
  var e = hist.redo.pop(); if(!e){ toast('やり直せる 操作は ありません'); return; }
  ui.sheet = null; commit(function(){ putBack(e.after); }, true); hist.undo.push(e); toast('やり直しました');
}
function check(){
  S.items.forEach(function(x){
    if(x.stackOf){ var p = item(x.stackOf); console.assert(p && !p.stackOf && p.face === x.face, '重ねは1段・同じ面', x.id); }
    if(x.kind === 'arrow') console.assert(item(x.from) && item(x.to), '矢印の両端がある', x.id);
  });
  var seen = {};
  S.stars.forEach(function(s){ var k = s.noteId + '/' + s.viewer + '/' + kindOf(s); console.assert(!seen[k], 'シールは1人・1種類につき1まいの付箋に1まい', k); seen[k] = 1; });
}
function toast(t){ ui.toast = t; render(); clearTimeout(ui.tt); ui.tt = setTimeout(function(){ ui.toast = ''; render(); }, 1600); }

/* サーバーから 届いた 変更を 取り込む（pend：まだ 送り終えていない 自分の 変更は 上書きしない） */
function mergeRemote(r, pend){
  pend = pend || {};
  if(r.modes) S.modes = r.modes;
  if(r.full){
    var keep = S.items.filter(function(x){ return pend[x.id]; }), ids = {};
    keep.forEach(function(x){ ids[x.id] = 1; });
    S.items = r.items.filter(function(x){ return !x.del && !ids[x.id]; }).concat(keep);
    var mineP = S.stars.filter(function(s){ return s.viewer === me && pend['*' + s.noteId + '|' + kindOf(s)]; });
    S.stars = r.stars.filter(function(s){ return s.on && !(s.viewer === me && pend['*' + s.noteId + '|' + kindOf(s)]); }).map(starOf).concat(mineP);
  } else {
    /* 初めて 取った 班は その班の 分を まるごと 入れ替える */
    (r.fullTeams || []).forEach(function(t){
      var gone = {};
      S.items.forEach(function(x){ if(x.team === t && !pend[x.id]) gone[x.id] = 1; });
      S.items = S.items.filter(function(x){ return !gone[x.id]; });
      S.stars = S.stars.filter(function(s){ return !gone[s.noteId] || (s.viewer === me && pend['*' + s.noteId + '|' + kindOf(s)]); });
    });
    r.items.forEach(function(x){
      if(pend[x.id]) return;
      S.items = S.items.filter(function(o){ return o.id !== x.id; });
      if(!x.del) S.items.push(x);
    });
    r.stars.forEach(function(s){
      if(s.viewer === me && pend['*' + s.noteId + '|' + kindOf(s)]) return;
      S.stars = S.stars.filter(function(o){ return !(o.noteId === s.noteId && o.viewer === s.viewer && kindOf(o) === kindOf(s)); });
      if(s.on) S.stars.push(starOf(s));
    });
  }

}
function starOf(s){ var o = {noteId:s.noteId, viewer:s.viewer, k:kindOf(s)}; if(s.x != null){ o.x = s.x; o.y = s.y; o.r = s.r; } return o; }
function afterRemote(){
  if(ui.viewTeam && !reach('view', ui.viewTeam) && !reach('propose', ui.viewTeam)){ ui.viewTeam = null; Platform.watch(null); }
  if(ui.sheet && ui.sheet.id && !item(ui.sheet.id) && ui.sheet.type !== 'write') ui.sheet = null;
  render();
}

/* ===== 検索（端末の中だけで 探す。児童は 自分の班だけ） ===== */
/* kind：'' しぼらない／'any' どれか ある／種類名 その種類が ある */
function searchHits(team, q, kind){
  q = String(q || '').trim();
  var words = q ? q.split(/[\s　]+/) : [];
  return S.items.filter(function(n){
    if(n.kind !== 'note' || (team && n.team !== team)) return false;
    if(kind && !starsOf(n.id).some(function(s){ return kind === 'any' || kindOf(s) === kind; })) return false;
    return words.every(function(w){ return String(n.text).indexOf(w) >= 0; });
  }).sort(function(a, b){ return kind ? cnt(b) - cnt(a) : 0; });
  function cnt(n){ return starsOf(n.id).filter(function(s){ return kind === 'any' || kindOf(s) === kind; }).length; }
}
function kindButtons(act, cur){
  return [{k:'', label:'しぼらない'}, {k:'any', label:'どれか ある'}].concat(KINDS.map(function(K){ return {k:K.k, img:K.k}; })).map(function(o){
    return '<button class="btn' + ((cur || '') === o.k ? ' on' : '') + '" data-act="' + act + '" data-k="' + o.k + '"' + (o.img ? ' aria-label="' + KINDS.filter(function(K){ return K.k === o.k; })[0].name + '"' : '') + '>' + (o.img ? sealImg(o.img, 28) : o.label) + '</button>';
  }).join('');
}
function gotoNote(id){
  var n = item(id); if(!n) return;
  var top = n.stackOf ? item(n.stackOf) || n : n;
  ui.sheet = null; ui.face = top.face; ui.flash = top.id; ui.viewTeam = null;
  render();
  var sc = document.querySelector('.wrap'); if(sc){ sc.scrollLeft = Math.max(0, top.x*GRID - 60); sc.scrollTop = Math.max(0, top.y*GRID - 60); }
  setTimeout(function(){ if(ui.flash === top.id){ ui.flash = null; render(); } }, 2500);
}

/* 何ができるか（不変条件はここに集める） */
function canEdit(){ return isMine(); }
function canPropose(){ return !isTeacher() && boardTeam() !== myTeam() && reach('propose', boardTeam()); }
function canStar(n){
  if(isTeacher() || n.kind !== 'note' || n.face === 'trash' || n.stackOf) return false;
  return n.team === myTeam() ? !!M().starIn : reach('starOut', n.team);
}
/* シールの数は 自分の班（と 先生）だけに 見せる。ほかの班では 自分が 貼ったかだけ */
function showCount(n){ return isTeacher() || n.team === myTeam(); }
function visibleFaces(){
  if(isTeacher() || isMine()) return FACES;
  return FACES.filter(function(f){ return (f.k === 'front' && reach('view', boardTeam())) || (f.k === 'gift' && canPropose()); });
}
function lookable(){ return SPOTS.filter(function(s){ return s.team !== myTeam() && (reach('view', s.team) || reach('propose', s.team)); }); }

function center(x){
  if(x.kind === 'frame') return {x:(x.x + x.w/2)*GRID, y:(x.y + x.h/2)*GRID};

}
/* 中心から 向き(dx,dy) に進んで 四角の ふちに 当たるまでの 距離 */
function edge(x, dx, dy){
  var hw = (x.kind === 'frame' ? x.w : NOTE_W) * GRID / 2, hh = (x.kind === 'frame' ? x.h : NOTE_H) * GRID / 2;
  var L = Math.sqrt(dx*dx + dy*dy) || 1, ux = Math.abs(dx/L), uy = Math.abs(dy/L);
  return Math.min(ux ? hw/ux : 1e9, uy ? hh/uy : 1e9);

function arrowsSVG(list){
  var s = '<svg class="arrows"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker></defs>';
  list.forEach(function(a){
    var A = item(a.from), B = item(a.to);
    if(!A || !B) return; // 同期の途中で 片方が まだ 届いていない
    var p = center(A), q = center(B);
    var dx = q.x - p.x, dy = q.y - p.y, L = Math.sqrt(dx*dx + dy*dy) || 1;
    var c1 = edge(A, dx, dy) + 10, c2 = edge(B, dx, dy) + 14;
    var x1 = p.x + dx/L*c1, y1 = p.y + dy/L*c1, x2 = q.x - dx/L*c2, y2 = q.y - dy/L*c2;
    s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#ah)"/>'
       + '<line class="hit" data-arrow="' + a.id + '" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
  });
  return s + '</svg>';
}

/* 先生が「シール（班の外）」を入れたら、その組の 全児童が この画面になる（範囲：同じ組／学年）。

function shuffled(arr, seed){

  return a;
}

function copyText(t){
  function fallback(){ var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); }
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(fallback); return; } }catch(e){}
  fallback();
}

/* ===== ドラッグ ===== */
var drag = null;
function boardPoint(e){ var b = document.getElementById('board').getBoundingClientRect(); return {x:e.clientX - b.left, y:e.clientY - b.top}; }
function noteAt(pt, exceptId){
  var found = null;
  document.querySelectorAll('#board .note').forEach(function(el){
    if(el.getAttribute('data-id') === exceptId) return;
    var r = el.getBoundingClientRect(), b = document.getElementById('board').getBoundingClientRect();
    var x = pt.x + b.left, y = pt.y + b.top;
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) found = el.getAttribute('data-id');
  });
  return found;
}
function faceAt(e){
  var f = null;
  document.querySelectorAll('.face[data-face]').forEach(function(el){
    var r = el.getBoundingClientRect();
    if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) f = el.getAttribute('data-face');
  });
  return f;
}
document.addEventListener('pointerdown', function(e){
  if(ui.sheet || !S) return;
  var grip = e.target.closest('[data-grip]');
  var el = grip ? grip.parentNode : e.target.closest('#board .item');
  if(!el) return;
  var x = item(el.getAttribute('data-id')); if(!x) return;
  drag = {id:x.id, el:el, sx:e.clientX, sy:e.clientY, ox:x.x, oy:x.y, ow:x.w, oh:x.h, moved:false, grip:!!grip};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
  if(!canEdit() || ui.tool === 'arrow' || ui.face === 'trash') return;
  drag.moved = true;
  if(drag.grip){
    drag.el.style.width = Math.max(4*GRID, drag.ow*GRID + dx) + 'px';
    drag.el.style.height = Math.max(3*GRID, drag.oh*GRID + dy) + 'px';
    return;
  }
  drag.el.classList.add('dragging');
  drag.el.style.left = (drag.ox*GRID + dx) + 'px'; drag.el.style.top = (drag.oy*GRID + dy) + 'px';
  var x = item(drag.id);
  if(x && x.kind === 'note'){
    var t = noteAt(boardPoint(e), drag.id);
    document.querySelectorAll('.note.target').forEach(function(n){ n.classList.remove('target'); });
    if(t){ var tel = document.querySelector('#board .note[data-id="' + t + '"]'); if(tel) tel.classList.add('target'); }
    document.querySelectorAll('.face').forEach(function(f){ f.classList.toggle('drop', f.getAttribute('data-face') === faceAt(e) && f.getAttribute('data-face') !== ui.face); });
  }
});
document.addEventListener('pointerup', function(e){
  if(!drag) return;
  var d = drag; drag = null;
  var x = item(d.id);
  if(!x){ render(); return; } // 動かしている間に 同期で 消えた
  if(!d.moved){ tapItem(x); return; }
  var dx = e.clientX - d.sx, dy = e.clientY - d.sy;
  if(d.grip){ commit(function(){ x.w = Math.max(4, Math.round(d.ow + dx/GRID)); x.h = Math.max(3, Math.round(d.oh + dy/GRID)); }); return; }
  var f = x.kind === 'note' ? faceAt(e) : null;
  var t = x.kind === 'note' ? noteAt(boardPoint(e), d.id) : null;
  if(f && f !== ui.face && f !== 'gift'){ moveFace(x, f); return; }
  if(t && item(t)){ stackOnto(x, item(t)); return; }
  commit(function(){ x.x = Math.max(0, Math.round(d.ox + dx/GRID)); x.y = Math.max(0, Math.round(d.oy + dy/GRID)); });
});

function stackOnto(x, target){
  commit(function(){
    stackOf(x.id).forEach(function(k){ k.stackOf = target.id; });
    x.stackOf = target.id; x.pick = 0;
    dropArrows(x.id);
  });
  toast((stackOf(target.id).length + 1) + 'まい 重なりました');
}
function moveFace(x, f){
  commit(function(){
    x.face = f; x.pick = 0; x.stackOf = null;
    stackOf(x.id).forEach(function(k){ k.face = f; });
    dropArrows(x.id);
  });
  toast(faceLabel(f) + 'へ うつしました');
}
function dropArrows(id){ S.items = S.items.filter(function(a){ return !(a.kind === 'arrow' && (a.from === id || a.to === id)); }); }
function tapItem(x){
  if(ui.tool === 'arrow' && canEdit()){
    if(!ui.arrowFrom){ ui.arrowFrom = x.id; render(); return; }
    if(ui.arrowFrom === x.id){ ui.arrowFrom = null; render(); return; }
    var from = ui.arrowFrom; ui.arrowFrom = null; ui.tool = 'move';
    commit(function(){ S.items.push({id:nid(), kind:'arrow', team:x.team, face:x.face, from:from, to:x.id}); });
    return;
  }
  if(x.kind === 'frame'){ if(canEdit()){ ui.sheet = {type:'frame', id:x.id}; render(); } return; }
  ui.sheet = {type:'note', id:x.id}; render();
}
function freeSpot(team, face){
  var used = S.items.filter(function(x){ return x.team === team && x.face === face && x.kind === 'note' && !x.stackOf; });
  for(var r = 0; r < 100; r++) for(var c = 0; c < 9; c++){
    var gx = 1 + c*(NOTE_W + 1), gy = 1 + r*(NOTE_H + 1);
    if(!used.some(function(u){ return Math.abs(u.x - gx) < NOTE_W && Math.abs(u.y - gy) < NOTE_H; })) return {x:gx, y:gy};
  }
  return {x:1, y:1};
}

      if(!canPropose()){ render(); return; }
      var to = boardTeam(), p = freeSpot(to, 'gift');

      toast(teamLabel(to) + 'へ おくりました'); return;
    }
    var q = freeSpot(myTeam(), ui.face);

  }
  if(act === 'tool'){ ui.tool = ui.tool === 'arrow' ? 'move' : 'arrow'; ui.arrowFrom = null; render(); return; }

    var sc = document.querySelector('.wrap');
    commit(function(){ S.items.push({id:nid(), kind:'frame', team:myTeam(), face:ui.face, x:Math.round(sc.scrollLeft/GRID) + 2, y:Math.round(sc.scrollTop/GRID) + 2, w:16, h:10, text:''}); });

  if(act === 'del'){ ui.sheet = null; commit(function(){ dropArrows(id); S.items = S.items.filter(function(x){ return x.id !== id; }); }); return; }
  if(act === 'star'){
    var n = item(id); if(!n || !canStar(n)) return;

    ui.sheet = null; if(!had) ui.pop = id;

      else S.stars.push({noteId:id, viewer:me, k:'star'});

  }
  if(act === 'showcase'){ commit(function(){ var x = item(id); x.showcase = !x.showcase; }); return; }
  if(act === 'kind'){ ui.kind = b.getAttribute('data-k'); ui.selSeal = null; render(); return; }
  if(act === 'peel'){ var pk = b.getAttribute('data-key').split('|'); ui.selSeal = null; commit(function(){ S.stars = S.stars.filter(function(x){ return !(x.noteId === pk[0] && x.viewer === me && x.k === pk[1]); }); }); return; }
  if(act === 'seal'){ var key = b.getAttribute('data-key'); ui.selSeal = ui.selSeal === key ? null : key; render(); return; }

    var r = b.getBoundingClientRect();
    /* シールは 付箋の 下の 帯（文字の 下）に 貼る。横は タップした 場所、縦は 帯の 中に おさめる */

    return;
  }
  if(act === 'mark'){ var m = +b.getAttribute('data-m'); commit(function(){ var x = item(id); x.mark = x.mark === m ? 0 : m; }); return; }
  if(act === 'pick'){
    var r = +b.getAttribute('data-r');

/* ショートカット：Ctrl+Z もどす／Ctrl+Y・Ctrl+Shift+Z やり直す／Ctrl+F さがす／Esc とじる。
   文字を 打っている 欄では Ctrl+Z などは その欄の ふつうの 動きに まかせる */
document.addEventListener('keydown', function(e){
  if(!S) return;
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key === 'Escape' && ui.sheet){ e.preventDefault(); ui.sheet = null; render(); return; }
  if(!(e.ctrlKey || e.metaKey) || e.altKey || typing || e.isComposing) return;
  var k = e.key.toLowerCase();
  if(k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return; }
  if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); redo(); return; }
  if(k === 'f' && !isTeacher() && isMine() && !modeOn(M().starOut)){ e.preventDefault(); ui.sheet = {type:'search', q:'', kind:''}; render(); setTimeout(function(){ var t = document.getElementById('s-text'); if(t) t.focus(); }, 0); }
  if(k === 'f' && isTeacher()){ var q = document.getElementById('t-q'); if(q){ e.preventDefault(); q.focus(); } }
});

    ['どうして うめたの？','いつ なくなったの？','ホームベースは 本物なの？','だれが きめたの？','どうして 野球場が なくなったの？'],

    ['どうして 街灯を けしたの？','ホタルは 何びき いるの？','ポスターは だれが かいたの？','どうして 小学生の 声が とどいたの？'],

    ['どうして お酒屋さんが 建てたの？','今も 光るの？','いつ 建てたの？','国は どうして 建てなかったの？']

      var members = S.roster.filter(function(c){ return c.team === s.team; });
      if(!members.length) return;

        S.items.push({id:nid(), kind:'note', team:s.team, face:'front', x:1 + (i%4)*(NOTE_W+1), y:2 + Math.floor(i/4)*(NOTE_H+2), text:t, author:members[i % members.length].id, mark:i%3 === 1 ? 1 : 0, showcase:i < 2});
      });
      S.items.push({id:nid(), kind:'note', team:s.team, face:'back', x:1, y:1, text:'どこに あるの？', author:members[0].id});
    });
  });
  toast('見本の 付箋を 入れました');
}
function csv(){
  var rows = [['組','班','面','付箋','書いた人','おくり元','印','えらんだ順','重ねた先','見てほしい'].concat(KINDS.map(function(K){ return K.name; }))];
  S.items.filter(function(x){ return x.kind === 'note'; }).forEach(function(n){
    var c = child(n.author), p = n.stackOf ? item(n.stackOf) : null, s = spot(n.team);
    rows.push([s.cls, s.no, faceLabel(n.face), n.text, c ? c.no : '', n.fromTeam ? teamLabel(n.fromTeam) : '', MARKS[n.mark || 0], n.pick || '', p ? p.text : '', n.showcase ? '○' : ''].concat(kindCounts(n)));
  });
  var body = '﻿' + rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type:'text/csv'})); a.download = 'toiboard.csv'; a.click();
}

Platform.start(function(s, who, spots, info){ S = s; me = who; if(spots) SPOTS = spots; if(info && info.cls) ui.tCls = info.cls; var c = child(me); if(!c && classes().indexOf(ui.tCls) < 0) ui.tCls = classes()[0]; render(); });
</script>
