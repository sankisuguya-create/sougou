<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>といボード</title>
<style>
:root{
  --ink:#1A1A1A; --sub:#55585E; --line:#D5D8DD; --paper:#F7F7F4; --white:#fff;
  --cat-1:#0F5EA8; --cat-2:#C86A00; --cat-3:#6E4310;
  --fill-a:#D7E8F8; --fill-b:#FBE3B4; --gift:#E6F2DD; --gold:#E0A43A;
  --grid:24px;
  --font:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);}
button{font-family:inherit;font-size:16px;color:inherit;cursor:pointer}
.btn{min-height:48px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--white);font-weight:700}
.btn.on{border-color:var(--cat-1);background:var(--fill-a)}
.btn.primary{background:var(--cat-1);border-color:var(--cat-1);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.demo{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub)}
.demo select{font-size:14px;padding:4px}

/* 上の帯 */
.head{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0 8px 0 0}
.faces{display:flex;gap:6px}
.face{min-height:52px;min-width:96px;padding:0 12px;border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;background:#fff;font-weight:700;font-size:17px}
.face.on{border-color:var(--ink)}
.face.drop{background:var(--fill-a);border-color:var(--cat-1)}
.face .n{font-size:13px;color:var(--sub);margin-left:4px}
.modes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:6px;padding:0 12px 8px;align-items:center;flex-wrap:wrap}
.tools .hint{font-size:14px;color:var(--sub);margin-left:6px}
.viewing{background:#FFF4D6;border:2px solid var(--cat-2);border-radius:12px;padding:6px 12px;margin:0 12px 8px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ボード */
.wrap{position:relative;margin:0 12px 12px;height:calc(100vh - 190px);min-height:420px;overflow:auto;border:2px solid var(--line);border-radius:12px;background:#fff;touch-action:pan-x pan-y}
.board{position:relative;width:2016px;height:6240px;
  background-image:
    linear-gradient(to right, rgba(15,94,168,.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(15,94,168,.10) 1px, transparent 1px);
  background-size:var(--grid) var(--grid);}
.board.trash{background-color:#F1F1EE}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.arrows line{stroke:var(--ink);stroke-width:4;pointer-events:stroke;cursor:pointer}
svg.arrows line.hit{stroke:transparent;stroke-width:28}

.item{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none}
.note{width:168px;min-height:120px;padding:14px 12px 22px;background:var(--fill-b);box-shadow:0 2px 4px rgba(0,0,0,.15);font-size:18px;font-weight:700;line-height:1.45;word-break:break-all;border-radius:2px}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:70px;height:16px;margin-left:-35px;background:rgba(255,255,255,.65);box-shadow:0 0 1px rgba(0,0,0,.2)}
.note.gift{background:var(--gift)}
.note.dragging{box-shadow:0 10px 20px rgba(0,0,0,.25);z-index:50;transform:rotate(-2deg)}
.note.target{outline:4px solid var(--cat-1);outline-offset:4px}
.note.sel{outline:4px dashed var(--cat-2);outline-offset:4px}
.layer{position:absolute;inset:0;background:var(--fill-b);border:1px solid rgba(0,0,0,.18);border-radius:2px;z-index:-1}
.note.gift .layer{background:var(--gift)}
.from{position:absolute;left:8px;bottom:4px;font-size:12px;color:var(--cat-3)}
.mark{position:absolute;right:6px;bottom:4px;display:flex;gap:4px;align-items:center}
.mark svg{width:22px;height:22px}
.pick{position:absolute;left:-12px;top:-12px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;display:grid;place-items:center}
.stars{position:absolute;right:-12px;top:-14px;display:flex;align-items:center;gap:2px;background:#fff;border-radius:99px;padding:2px 6px 2px 2px;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:14px;font-weight:700}
.stars img{width:28px;height:28px;display:block}
.stars span{display:flex;align-items:center}
.show{position:absolute;left:8px;top:-14px;background:#0F5EA8;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
/* シール貼り（ほかの班）画面 */
.gal{padding:12px 16px 80px}
.gal-head{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;background:var(--paper)}
.gal-head h1{font-size:22px;margin:0}
.kpick{width:64px;height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;display:grid;place-items:center}
.kpick.on{border-color:var(--cat-1);background:var(--fill-a)}
.kpick img{width:46px;height:46px;pointer-events:none}
.gteam{margin:18px 0 8px;font-size:18px}
.gnotes{display:flex;flex-wrap:wrap;gap:28px}
.big{position:relative;width:240px;min-height:180px;padding:24px 16px 20px;background:var(--fill-b);box-shadow:0 2px 5px rgba(0,0,0,.18);font-size:21px;font-weight:700;line-height:1.5;word-break:break-all;border-radius:2px;cursor:pointer}
.big::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:18px;margin-left:-42px;background:rgba(255,255,255,.65);box-shadow:0 0 1px rgba(0,0,0,.2)}
.seal{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px}
.seal img{width:100%;height:100%;display:block;pointer-events:none}
.seal.sel{filter:drop-shadow(0 0 3px #0F5EA8)}
.peel{position:absolute;right:-30px;top:-30px;min-height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:99px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap;z-index:5}
@keyframes stick{0%{transform:scale(1.5) rotate(var(--r))}60%{transform:scale(.9) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r))}}
.seal.new{animation:stick .28s ease-out}
.frame{border:3px dashed var(--cat-3);border-radius:10px;background:rgba(251,227,180,.12)}
.frame .label{position:absolute;left:8px;top:-15px;background:#fff;padding:0 6px;font-weight:700;font-size:16px;color:var(--cat-3);min-width:40px;min-height:24px}
.frame .grip{position:absolute;right:-14px;bottom:-14px;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--cat-3)}
.empty{position:absolute;left:40px;top:40px;color:var(--sub);font-size:18px}

/* 下から出る操作 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:min(720px,100%);border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{min-height:56px}
textarea{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--ink);border-radius:10px;min-height:96px}
.stacklist{display:flex;gap:10px;flex-wrap:wrap}
.stacklist .note{position:relative}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;z-index:200}

/* 先生 */
.teacher{padding:12px;max-width:1100px}
.teacher h2{font-size:18px;margin:18px 0 8px}
.mode{display:flex;align-items:center;gap:10px;margin:6px 0}
.mode .btn{min-width:220px;text-align:left}
table{border-collapse:collapse;font-size:14px;background:#fff}
td,th{border:1px solid var(--line);padding:4px 8px;text-align:left}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.stars.pop svg{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 語彙 ===== */
var VER = 2, GRID = 24, NOTE_W = 7, NOTE_H = 5;
var FACES = [
  {k:'front', label:'表がわ'},
  {k:'back',  label:'うらがわ'},
  {k:'gift',  label:'いただきもの'},
  {k:'trash', label:'ゴミばこ'}
];
var MARKS = ['', 'ひとことで 答えられる', 'せつめいが いる'];
var SPOTS = [
  {team:1, name:'阪急西宮北口'}, {team:2, name:'甲山'}, {team:3, name:'西宮砲台'},
  {team:4, name:'神戸女学院'}, {team:5, name:'有馬川'}, {team:6, name:'えびすかき'}, {team:7, name:'今津灯台'}
];
var MODES = [
  {k:'view',    label:'共同閲覧',          desc:'ほかの班のボードを見られる'},
  {k:'propose', label:'アイデア提案',      desc:'ほかの班の「いただきもの」に付箋を貼れる'},
  {k:'starIn',  label:'シール（班の中）',  desc:'自分の班の付箋にシールを貼れる'},
  {k:'starOut', label:'シール（班の外）',  desc:'全児童の画面が、ほかの班の「見てほしい付箋」に シールを貼る画面に 切り替わる'}
];

/* ===== 保存（本番は GAS に差し替え） ===== */
var KEY = 'toiboard.v2';
var Platform = {
  load:function(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } },
  save:function(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} },
  me:function(){ try{ return localStorage.getItem(KEY+'.me') || 'c01'; }catch(e){ return 'c01'; } },
  setMe:function(v){ try{ localStorage.setItem(KEY+'.me', v); }catch(e){} },
  onRemote:function(fn){ window.addEventListener('storage', function(e){ if(e.key === KEY) fn(); }); }
};
function fresh(){
  var roster = [];
  for(var i = 1; i <= 28; i++) roster.push({id:'c' + (i < 10 ? '0' : '') + i, no:i, team:Math.ceil(i / 4)});
  return {ver:VER, roster:roster, items:[], stars:[], modes:{view:false, propose:false, starIn:false, starOut:false}, seq:0};
}
var S = Platform.load(); if(!S || S.ver !== VER) S = fresh();
var me = Platform.me();
var ui = {face:'front', viewTeam:null, tool:'move', arrowFrom:null, sheet:null, toast:'', tTeam:1, armed:false, pop:null};

function child(id){ return S.roster.filter(function(c){ return c.id === id; })[0]; }
function myTeam(){ var c = child(me); return c ? c.team : 0; }
function boardTeam(){ return me === 'teacher' ? ui.tTeam : (ui.viewTeam || myTeam()); }
function isMine(){ return me !== 'teacher' && boardTeam() === myTeam(); }
function spot(t){ return SPOTS.filter(function(s){ return s.team === t; })[0]; }
function item(id){ return S.items.filter(function(x){ return x.id === id; })[0]; }
function stackOf(id){ return S.items.filter(function(x){ return x.stackOf === id; }); }
function starsOf(id){ return S.stars.filter(function(s){ return s.noteId === id; }); }
function nid(){ S.seq++; return 'i' + S.seq; }

function commit(fn){ fn(); check(); Platform.save(S); render(); }
function check(){
  S.items.forEach(function(x){
    if(x.stackOf){ var p = item(x.stackOf); console.assert(p && !p.stackOf && p.face === x.face, '重ねは1段・同じ面', x.id); }
    if(x.kind === 'arrow') console.assert(item(x.from) && item(x.to), '矢印の両端がある', x.id);
  });
  var seen = {};
  S.stars.forEach(function(s){ var k = s.noteId + '/' + s.viewer + '/' + (s.k || 'star'); console.assert(!seen[k], 'シールは1人・1種類につき1まいの付箋に1まい', k); seen[k] = 1; });
}
function toast(t){ ui.toast = t; render(); clearTimeout(ui.tt); ui.tt = setTimeout(function(){ ui.toast = ''; render(); }, 1600); }

/* 何ができるか（不変条件はここに集める） */
function canEdit(){ return isMine(); }
function canPropose(){ return me !== 'teacher' && S.modes.propose && boardTeam() !== myTeam(); }
function canStar(n){
  if(me === 'teacher' || n.kind !== 'note' || n.face === 'trash' || n.stackOf) return false;
  return n.team === myTeam() ? S.modes.starIn : S.modes.starOut;
}
function visibleFaces(){
  if(me === 'teacher' || isMine()) return FACES;
  return FACES.filter(function(f){ return f.k === 'front' || (f.k === 'gift' && canPropose()); });
}

/* ===== 絵 ===== */
/* シールは 画像で持つ（描画負荷を下げるため）。絵の正本は tools/make-stickers.cjs。 */

var KINDS = [{k:'star', name:'しりたい！'}, {k:'circle', name:'まる'}, {k:'bolt', name:'ひらめき'}];
function sealImg(k, size){ return '<img src="' + SEAL_IMG[k] + '" alt="" width="' + (size || 28) + '" height="' + (size || 28) + '" draggable="false">'; }
var ICON = {
  star:sealImg('star'),
  m1:'<svg viewBox="0 0 24 24"><rect x="3" y="9" width="10" height="6" rx="3" fill="#0F5EA8"/><circle cx="18" cy="12" r="2.6" fill="#0F5EA8"/></svg>',
  m2:'<svg viewBox="0 0 24 24"><path d="M3 4h18v12H9l-5 4v-4H3z" fill="none" stroke="#6E4310" stroke-width="2"/><path d="M7 8h10M7 12h7" stroke="#6E4310" stroke-width="2"/></svg>'
};
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function noteHTML(n, opt){
  opt = opt || {};
  var layers = '', kids = stackOf(n.id).length;
  for(var i = Math.min(kids, 6); i >= 1; i--) layers += '<div class="layer" style="transform:translate(' + (i*5) + 'px,' + (i*5) + 'px)"></div>';
  var st = starsOf(n.id), mine = st.some(function(s){ return s.viewer === me; });
  var stars = st.length ? '<div class="stars' + (ui.pop === n.id ? ' pop' : '') + '" data-stars="' + n.id + '">' + KINDS.map(function(K){
      var c = st.filter(function(x){ return (x.k || 'star') === K.k; }).length;
      return c ? '<span data-kind="' + K.k + '">' + sealImg(K.k) + (c >= 2 ? '×' + c : '') + '</span>' : '';
    }).join('') + '</div>' : '';
  var show = n.showcase ? '<div class="show">見てほしい</div>' : '';
  var mark = n.mark ? '<div class="mark" title="' + MARKS[n.mark] + '">' + ICON['m' + n.mark] + '</div>' : '';
  var from = n.fromTeam ? '<div class="from">' + n.fromTeam + 'はんから</div>' : '';
  var pick = n.pick ? '<div class="pick">' + n.pick + '</div>' : '';
  var pos = opt.inline ? '' : 'left:' + (n.x*GRID) + 'px;top:' + (n.y*GRID) + 'px;';
  return '<div class="item note' + (n.fromTeam ? ' gift' : '') + (ui.arrowFrom === n.id ? ' sel' : '') + '" data-id="' + n.id + '" data-kids="' + kids + '" style="' + pos + '">'
    + layers + esc(n.text) + pick + mark + from + show + stars + '</div>';
}
function frameHTML(f){
  return '<div class="item frame" data-id="' + f.id + '" style="left:' + (f.x*GRID) + 'px;top:' + (f.y*GRID) + 'px;width:' + (f.w*GRID) + 'px;height:' + (f.h*GRID) + 'px">'
    + '<div class="label">' + esc(f.text || '') + '</div>' + (canEdit() ? '<div class="grip" data-grip="' + f.id + '"></div>' : '') + '</div>';
}
function center(x){
  if(x.kind === 'frame') return {x:(x.x + x.w/2)*GRID, y:(x.y + x.h/2)*GRID};
  return {x:(x.x + NOTE_W/2)*GRID, y:(x.y + NOTE_H/2)*GRID};
}
/* 中心から 向き(dx,dy) に進んで 四角の ふちに 当たるまでの 距離 */
function edge(x, dx, dy){
  var hw = (x.kind === 'frame' ? x.w : NOTE_W) * GRID / 2, hh = (x.kind === 'frame' ? x.h : NOTE_H) * GRID / 2;
  var L = Math.sqrt(dx*dx + dy*dy) || 1, ux = Math.abs(dx/L), uy = Math.abs(dy/L);
  return Math.min(ux ? hw/ux : 1e9, uy ? hh/uy : 1e9);
}
function arrowsSVG(list){
  var s = '<svg class="arrows"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker></defs>';
  list.forEach(function(a){
    var p = center(item(a.from)), q = center(item(a.to));
    var A = item(a.from), B = item(a.to);
    var dx = q.x - p.x, dy = q.y - p.y, L = Math.sqrt(dx*dx + dy*dy) || 1;
    var c1 = edge(A, dx, dy) + 10, c2 = edge(B, dx, dy) + 14;
    var x1 = p.x + dx/L*c1, y1 = p.y + dy/L*c1, x2 = q.x - dx/L*c2, y2 = q.y - dy/L*c2;
    s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#ah)"/>'
       + '<line class="hit" data-arrow="' + a.id + '" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
  });
  return s + '</svg>';
}

/* ===== 画面 ===== */
function render(){
  if(drag) return; // 動かしている間は描き直さない（終わってから反映）
  var app = document.getElementById('app');
  var active = document.activeElement, keep = active && active.id ? {id:active.id, v:active.value, s:active.selectionStart} : null;
  var opts = '<option value="teacher">先生</option>' + S.roster.map(function(c){ return '<option value="' + c.id + '">' + c.no + 'ばん（' + c.team + 'はん）</option>'; }).join('');
  var h = '<div class="demo">見本の切り替え <select id="who">' + opts + '</select> 本番では Google アカウントで自動で決まります</div>';
  h += me === 'teacher' ? viewTeacher() : viewChild();
  if(ui.sheet) h += viewSheet();
  if(ui.toast) h += '<div class="toast">' + esc(ui.toast) + '</div>';
  var sc = document.querySelector('.wrap'), pos = sc ? [sc.scrollLeft, sc.scrollTop] : null;
  app.innerHTML = h;
  document.getElementById('who').value = me;
  sc = document.querySelector('.wrap'); if(sc && pos){ sc.scrollLeft = pos[0]; sc.scrollTop = pos[1]; }
  if(keep){ var el = document.getElementById(keep.id); if(el){ el.value = keep.v; el.focus(); try{ el.setSelectionRange(keep.s, keep.s); }catch(e){} } }
  ui.pop = null;
}

function boardHTML(team, face){
  var all = S.items.filter(function(x){ return x.team === team && x.face === face; });
  var frames = all.filter(function(x){ return x.kind === 'frame'; });
  var notes = all.filter(function(x){ return x.kind === 'note' && !x.stackOf; });
  var arrows = all.filter(function(x){ return x.kind === 'arrow'; });
  var h = '<div class="wrap"><div class="board' + (face === 'trash' ? ' trash' : '') + '" id="board">';
  h += frames.map(frameHTML).join('') + arrowsSVG(arrows) + notes.map(function(n){ return noteHTML(n); }).join('');
  if(!all.length) h += '<div class="empty">' + (face === 'gift' ? 'ほかの班からの 付箋は まだ ありません' : face === 'trash' ? 'すてた 付箋は ここに のこります' : 'まだ 何も ありません') + '</div>';
  return h + '</div></div>';
}

/* 先生が「シール（班の外）」を入れたら、全児童がこの画面になる。
   ほかの班の「見てほしい付箋」を大きく並べ、選んだシールを 付箋の好きな場所に 貼る。
   人気への同調を避けるため、ほかの子の シールは 見せない（集計は 班のボードに 出る）。班の順番は 子どもごとに ばらばら。 */
function shuffled(arr, seed){
  var a = arr.slice(), h = 0; for(var i = 0; i < seed.length; i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  for(var j = a.length - 1; j > 0; j--){ h = (h*1103515245 + 12345) >>> 0; var t = h % (j + 1), x = a[j]; a[j] = a[t]; a[t] = x; }
  return a;
}
function viewGallery(){
  var kind = ui.kind || 'star';
  var h = '<div class="gal"><div class="gal-head"><h1>シールを 貼ろう</h1>' + KINDS.map(function(K){
    return '<button class="kpick' + (K.k === kind ? ' on' : '') + '" data-act="kind" data-k="' + K.k + '" aria-label="' + K.name + '">' + sealImg(K.k, 46) + '</button>';
  }).join('') + '<span class="hint">シールを えらんで、付箋の 貼りたい ところを タップ</span></div>';
  var teams = shuffled(SPOTS.filter(function(s){ return s.team !== myTeam(); }), me);
  var any = false;
  teams.forEach(function(sp){
    var notes = S.items.filter(function(x){ return x.team === sp.team && x.kind === 'note' && x.showcase && x.face === 'front' && !x.stackOf; });
    if(!notes.length) return; any = true;
    h += '<h2 class="gteam">' + esc(sp.name) + '</h2><div class="gnotes">';
    notes.forEach(function(n){
      var mine = S.stars.filter(function(x){ return x.noteId === n.id && x.viewer === me && x.x != null; });
      h += '<div class="big" data-act="big" data-id="' + n.id + '">' + esc(n.text) + mine.map(function(x){
        var key = n.id + '|' + x.k;
        return '<div class="seal' + (ui.selSeal === key ? ' sel' : '') + (ui.fresh === key ? ' new' : '') + '" data-act="seal" data-key="' + key + '" style="left:' + x.x + '%;top:' + x.y + '%;--r:' + x.r + 'deg;transform:rotate(' + x.r + 'deg)">'
          + sealImg(x.k, 52) + (ui.selSeal === key ? '<button class="peel" data-act="peel" data-key="' + key + '">はがす</button>' : '') + '</div>';
      }).join('') + '</div>';
    });
    h += '</div>';
  });
  if(!any) h += '<p class="hint" style="font-size:18px">ほかの班の「見てほしい付箋」は まだ ありません</p>';
  ui.fresh = null;
  return h + '</div>';
}

function viewChild(){
  if(S.modes.starOut) return viewGallery();
  var team = boardTeam(), sp = spot(team), mine = isMine();
  var faces = visibleFaces();
  if(!faces.some(function(f){ return f.k === ui.face; })) ui.face = 'front';
  var h = '<div class="head"><h1>' + esc(sp.name) + '</h1><div class="faces">';
  faces.forEach(function(f){
    var n = S.items.filter(function(x){ return x.team === team && x.face === f.k && x.kind === 'note'; }).length;

/* ===== ドラッグ ===== */
var drag = null;
function boardPoint(e){ var b = document.getElementById('board').getBoundingClientRect(); return {x:e.clientX - b.left, y:e.clientY - b.top}; }
function noteAt(pt, exceptId){
  var found = null;
  document.querySelectorAll('#board .note').forEach(function(el){
    if(el.getAttribute('data-id') === exceptId) return;
    var r = el.getBoundingClientRect(), b = document.getElementById('board').getBoundingClientRect();
    var x = pt.x + b.left, y = pt.y + b.top;
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) found = el.getAttribute('data-id');
  });
  return found;
}
function faceAt(e){
  var f = null;
  document.querySelectorAll('.face[data-face]').forEach(function(el){
    var r = el.getBoundingClientRect();
    if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) f = el.getAttribute('data-face');
  });
  return f;
}
document.addEventListener('pointerdown', function(e){
  if(ui.sheet) return;
  var grip = e.target.closest('[data-grip]');
  var el = grip ? grip.parentNode : e.target.closest('#board .item');
  if(!el) return;
  var x = item(el.getAttribute('data-id')); if(!x) return;
  drag = {id:x.id, el:el, sx:e.clientX, sy:e.clientY, ox:x.x, oy:x.y, ow:x.w, oh:x.h, moved:false, grip:!!grip};
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', function(e){
  if(!drag) return;
  var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if(!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
  if(!canEdit() || ui.tool === 'arrow') return;
  drag.moved = true;
  if(drag.grip){
    drag.el.style.width = Math.max(4*GRID, drag.ow*GRID + dx) + 'px';
    drag.el.style.height = Math.max(3*GRID, drag.oh*GRID + dy) + 'px';
    return;
  }
  drag.el.classList.add('dragging');
  drag.el.style.left = (drag.ox*GRID + dx) + 'px'; drag.el.style.top = (drag.oy*GRID + dy) + 'px';
  if(item(drag.id).kind === 'note'){
    var t = noteAt(boardPoint(e), drag.id);
    document.querySelectorAll('.note.target').forEach(function(n){ n.classList.remove('target'); });
    if(t){ var tel = document.querySelector('#board .note[data-id="' + t + '"]'); if(tel) tel.classList.add('target'); }
    document.querySelectorAll('.face').forEach(function(f){ f.classList.toggle('drop', f.getAttribute('data-face') === faceAt(e) && f.getAttribute('data-face') !== ui.face); });
  }
});
document.addEventListener('pointerup', function(e){
  if(!drag) return;
  var d = drag; drag = null;
  var x = item(d.id);
  if(!d.moved){ tapItem(x); return; }
  var dx = e.clientX - d.sx, dy = e.clientY - d.sy;
  if(d.grip){ commit(function(){ x.w = Math.max(4, Math.round(d.ow + dx/GRID)); x.h = Math.max(3, Math.round(d.oh + dy/GRID)); }); return; }
  var f = x.kind === 'note' ? faceAt(e) : null;
  var t = x.kind === 'note' ? noteAt(boardPoint(e), d.id) : null;
  if(f && f !== ui.face && f !== 'gift'){ moveFace(x, f); return; }
  if(t){ stackOnto(x, item(t)); return; }
  commit(function(){ x.x = Math.max(0, Math.round(d.ox + dx/GRID)); x.y = Math.max(0, Math.round(d.oy + dy/GRID)); });
});

function stackOnto(x, target){
  commit(function(){
    stackOf(x.id).forEach(function(k){ k.stackOf = target.id; });
    x.stackOf = target.id; x.pick = 0;
    dropArrows(x.id);
  });
  toast((stackOf(target.id).length + 1) + 'まい 重なりました');
}
function moveFace(x, f){
  commit(function(){
    x.face = f; x.pick = 0; x.stackOf = null;
    stackOf(x.id).forEach(function(k){ k.face = f; });
    dropArrows(x.id);
  });
  toast(FACES.filter(function(z){ return z.k === f; })[0].label + 'へ うつしました');
}
function dropArrows(id){ S.items = S.items.filter(function(a){ return !(a.kind === 'arrow' && (a.from === id || a.to === id)); }); }
function tapItem(x){
  if(ui.tool === 'arrow' && canEdit()){
    if(!ui.arrowFrom){ ui.arrowFrom = x.id; render(); return; }
    if(ui.arrowFrom === x.id){ ui.arrowFrom = null; render(); return; }
    var from = ui.arrowFrom; ui.arrowFrom = null; ui.tool = 'move';
    commit(function(){ S.items.push({id:nid(), kind:'arrow', team:x.team, face:x.face, from:from, to:x.id}); });
    return;
  }
  if(x.kind === 'frame'){ if(canEdit()){ ui.sheet = {type:'frame', id:x.id}; render(); } return; }
  ui.sheet = {type:'note', id:x.id}; render();
}
function freeSpot(team, face){
  var used = S.items.filter(function(x){ return x.team === team && x.face === face && x.kind === 'note' && !x.stackOf; });
  for(var r = 0; r < 100; r++) for(var c = 0; c < 9; c++){
    var gx = 1 + c*(NOTE_W + 1), gy = 1 + r*(NOTE_H + 1);
    if(!used.some(function(u){ return Math.abs(u.x - gx) < NOTE_W && Math.abs(u.y - gy) < NOTE_H; })) return {x:gx, y:gy};
  }
  return {x:1, y:1};
}

/* ===== 操作 ===== */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act],[data-face],[data-arrow]'); if(!b) return;
  if(b.hasAttribute('data-arrow')){ if(canEdit()){ ui.sheet = {type:'arrow', id:b.getAttribute('data-arrow')}; render(); } return; }
  if(b.hasAttribute('data-face')){ ui.face = b.getAttribute('data-face'); ui.arrowFrom = null; render(); return; }
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if(act === 'close'){ if(e.target !== b) return; ui.sheet = null; render(); return; }
  if(act === 'add'){ ui.sheet = {type:'write', gift:!isMine()}; render(); setTimeout(function(){ var t = document.getElementById('w-text'); if(t) t.focus(); }, 0); return; }
  if(act === 'edit'){ ui.sheet = {type:'write', id:id, text:item(id).text}; render(); return; }
  if(act === 'w-save'){
    var text = document.getElementById('w-text').value.trim(); if(!text) return;
    var s = ui.sheet; ui.sheet = null;
    if(s.id){ commit(function(){ item(s.id).text = text; }); return; }
    if(s.gift){
      if(!canPropose()) return;
      var p = freeSpot(boardTeam(), 'gift');
      commit(function(){ S.items.push({id:nid(), kind:'note', team:boardTeam(), face:'gift', x:p.x, y:p.y, text:text, author:me, fromTeam:myTeam()}); });
      toast(boardTeam() + 'はんへ おくりました'); return;
    }
    var q = freeSpot(myTeam(), ui.face);
    commit(function(){ S.items.push({id:nid(), kind:'note', team:myTeam(), face:ui.face, x:q.x, y:q.y, text:text, author:me}); });
    return;
  }
  if(act === 'tool'){ ui.tool = ui.tool === 'arrow' ? 'move' : 'arrow'; ui.arrowFrom = null; render(); return; }
  if(act === 'frame'){
    var sc = document.querySelector('.wrap');
    commit(function(){ S.items.push({id:nid(), kind:'frame', team:myTeam(), face:ui.face, x:Math.round(sc.scrollLeft/GRID) + 2, y:Math.round(sc.scrollTop/GRID) + 2, w:16, h:10, text:''}); });
    return;
  }
  if(act === 'f-save'){ var v = document.getElementById('f-text').value; ui.sheet = null; commit(function(){ item(id).text = v; }); return; }
  if(act === 'del'){ ui.sheet = null; commit(function(){ dropArrows(id); S.items = S.items.filter(function(x){ return x.id !== id; }); }); return; }
  if(act === 'star'){
    var n = item(id); if(!canStar(n)) return;
    var had = starsOf(id).some(function(s){ return s.viewer === me && (s.k || 'star') === 'star'; });
    ui.sheet = null; if(!had) ui.pop = id;
    commit(function(){
      if(had) S.stars = S.stars.filter(function(s){ return !(s.noteId === id && s.viewer === me && (s.k || 'star') === 'star'); });
      else S.stars.push({noteId:id, viewer:me, k:'star'});
    });
    return;
  }
  if(act === 'showcase'){ commit(function(){ var x = item(id); x.showcase = !x.showcase; }); return; }
  if(act === 'kind'){ ui.kind = b.getAttribute('data-k'); ui.selSeal = null; render(); return; }
  if(act === 'peel'){ var pk = b.getAttribute('data-key').split('|'); ui.selSeal = null; commit(function(){ S.stars = S.stars.filter(function(x){ return !(x.noteId === pk[0] && x.viewer === me && x.k === pk[1]); }); }); return; }
  if(act === 'seal'){ var key = b.getAttribute('data-key'); ui.selSeal = ui.selSeal === key ? null : key; render(); return; }
  if(act === 'big'){
    if(e.target.closest('.seal')) return;
    if(ui.selSeal){ ui.selSeal = null; render(); return; }
    var nn = item(id), kind = ui.kind || 'star'; if(!nn || !canStar(nn)) return;
    if(starsOf(id).some(function(x){ return x.viewer === me && x.k === kind; })){ toast('この シールは もう 貼って あります'); return; }
    var r = b.getBoundingClientRect();
    var sx = Math.max(8, Math.min(92, (e.clientX - r.left) / r.width * 100)), sy = Math.max(8, Math.min(92, (e.clientY - r.top) / r.height * 100));
    ui.fresh = id + '|' + kind;
    commit(function(){ S.stars.push({noteId:id, viewer:me, k:kind, x:+sx.toFixed(1), y:+sy.toFixed(1), r:Math.round(Math.random()*30 - 15)}); });
    return;
  }
  if(act === 'mark'){ var m = +b.getAttribute('data-m'); commit(function(){ var x = item(id); x.mark = x.mark === m ? 0 : m; }); return; }
  if(act === 'pick'){
    var r = +b.getAttribute('data-r');
    commit(function(){
      var x = item(id), was = x.pick === r;
      S.items.forEach(function(o){ if(o.team === x.team && o.pick === r) o.pick = 0; });
      x.pick = was ? 0 : r;
    });
    return;
  }
  if(act === 'toface'){ ui.sheet = null; moveFace(item(id), b.getAttribute('data-f')); return; }
  if(act === 'unstack'){
    var k = item(id), parent = item(k.stackOf);
    commit(function(){ k.stackOf = null; var p = freeSpot(k.team, k.face); k.x = p.x; k.y = p.y; });
    if(!stackOf(parent.id).length) ui.sheet = null;
    render(); return;
  }
  if(act === 'look'){ ui.viewTeam = +b.getAttribute('data-t'); ui.face = 'front'; ui.tool = 'move'; render(); return; }
  if(act === 'home'){ ui.viewTeam = null; ui.face = 'front'; render(); return; }
  if(act === 'mode'){ var key = b.getAttribute('data-k'); commit(function(){ S.modes[key] = !S.modes[key]; }); return; }
  if(act === 'tteam'){ ui.tTeam = +b.getAttribute('data-t'); render(); return; }
  if(act === 'seed'){ seed(); return; }
  if(act === 'wipe'){ if(!ui.armed){ ui.armed = true; render(); setTimeout(function(){ ui.armed = false; render(); }, 3000); return; } ui.armed = false; S = fresh(); Platform.save(S); render(); return; }
  if(act === 'csv'){ csv(); return; }
});

});

function seed(){
  var Q = {
    1:['どうして うめたの？','いつ なくなったの？','ホームベースは 本物なの？','だれが きめたの？','どうして 野球場が なくなったの？'],
    2:['どうして 石が ちがうの？','甲山は 火山なの？','だれが 名前を つけたの？','どうして おわんの 形なの？'],
    3:['どうして 使わなかったの？','だれが 作ったの？','どうして 海の そばに あるの？','中に 入れるの？'],
    4:['どうして 重要文化財に なったの？','だれが たてたの？','今も 使っているの？'],
    5:['どうして 街灯を けしたの？','ホタルは 何びき いるの？','ポスターは だれが かいたの？','どうして 小学生の 声が とどいたの？'],
    6:['どうして 日本じゅうに 広まったの？','今も 人形は あるの？','だれが はじめたの？'],
    7:['どうして お酒屋さんが 建てたの？','今も 光るの？','いつ 建てたの？','国は どうして 建てなかったの？']
  };
  commit(function(){
    SPOTS.forEach(function(s){
      if(S.items.some(function(x){ return x.team === s.team; })) return;
      var members = S.roster.filter(function(c){ return c.team === s.team; });
      Q[s.team].forEach(function(t, i){
        S.items.push({id:nid(), kind:'note', team:s.team, face:'front', x:1 + (i%4)*(NOTE_W+1), y:2 + Math.floor(i/4)*(NOTE_H+2), text:t, author:members[i%4].id, mark:i%3 === 1 ? 1 : 0, showcase:i < 2});
      });
      S.items.push({id:nid(), kind:'note', team:s.team, face:'back', x:1, y:1, text:'どこに あるの？', author:members[0].id});
    });
  });
  toast('見本の 付箋を 入れました');
}
function csv(){
  var rows = [['班','面','付箋','書いた人','おくり元','印','えらんだ順','重ねた先','見てほしい','しりたい！','まる','ひらめき']];
  S.items.filter(function(x){ return x.kind === 'note'; }).forEach(function(n){
    var c = child(n.author), p = n.stackOf ? item(n.stackOf) : null;
    rows.push([n.team, FACES.filter(function(f){ return f.k === n.face; })[0].label, n.text, c ? c.no : '', n.fromTeam || '', MARKS[n.mark || 0], n.pick || '', p ? p.text : '', n.showcase ? '○' : ''].concat(KINDS.map(function(K){ return starsOf(n.id).filter(function(x){ return (x.k || 'star') === K.k; }).length; })));
  });
  var body = '﻿' + rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], {type:'text/csv'})); a.download = 'toiboard.csv'; a.click();
}

render();
</script>
</body>
